<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejamento Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pt-32">

    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="w-full px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-4">
                <h1 class="text-xs md:text-sm font-extrabold text-blue-600 tracking-tight cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">Planejamento Acadêmico</h1>
                <div id="container-btn-admin"></div>
            </div>

            <div class="flex items-center space-x-2 md:space-x-3">
                <select id="select-semestre-destino" class="px-2.5 py-1.5 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500">
                    <option value="">Escolha o Semestre</option>
                    <option value="1º Semestre">1º Semestre</option>
                    <option value="2º Semestre">2º Semestre</option>
                    <option value="3º Semestre">3º Semestre</option>
                    <option value="4º Semestre">4º Semestre</option>
                    <option value="5º Semestre">5º Semestre</option>
                    <option value="6º Semestre">6º Semestre</option>
                    <option value="7º Semestre">7º Semestre</option>
                    <option value="8º Semestre">8º Semestre</option>
                    <option value="9º Semestre">9º Semestre</option>
                    <option value="10º Semestre">10º Semestre</option>
                </select>

                <button id="btn-cadastrar-semestre" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700 transition shadow-sm whitespace-nowrap">
                    Cadastrar Disciplinas
                </button>

                <div id="bloco-usuario-topo" class="flex items-center space-x-2 pl-2 border-l border-gray-200 relative"></div>
            </div>
        </div>

        <div class="w-full bg-gray-50 px-4 md:px-6 py-2">
            <nav class="flex items-center space-x-6 text-xs md:text-sm font-medium text-gray-600 overflow-x-auto">
                <a href="#" class="text-blue-600 font-semibold hover:text-blue-700 transition whitespace-nowrap">Disciplinas</a>
                <a href="#container-semestres" onclick="rolarParaGrade(event)" class="hover:text-blue-600 transition whitespace-nowrap">Semestres</a>
                <a href="jornal.html" class="hover:text-blue-600 transition whitespace-nowrap">Jornal Blitz</a>
                <a href="biblioteca.html" class="hover:text-blue-600 transition whitespace-nowrap">Biblioteca</a>
                <a href="#" onclick="acaoRequerAuth(event, 'LOJA')" class="hover:text-blue-600 transition whitespace-nowrap">LOJA</a>
            </nav>
        </div>
    </header>

    <div id="mensagem-sucesso-global" class="fixed top-28 left-1/2 transform -translate-x-1/2 z-[100] hidden bg-green-600 text-white px-6 py-3 rounded-xl shadow-xl text-sm font-semibold transition-all duration-300 flex items-center space-x-2">
        <span>✅ Disciplinas cadastradas com sucesso!</span>
    </div>

    <!-- MODAL AUTH -->
    <div id="modal-auth" class="hidden fixed inset-0 bg-black/50 z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative overflow-hidden">
            <button onclick="fecharModalAuth()" class="absolute top-4 right-4 text-gray-400 font-bold text-lg">✕</button>
            <div id="form-login-container">
                <h2 class="text-2xl font-extrabold text-gray-900 mb-1 text-center">Entrar no Sistema</h2>
                <form id="form-login" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-gray-700 mb-1">E-mail</label><input type="email" id="login-email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-700 mb-1">Senha</label><input type="password" id="login-senha" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition text-sm">Entrar</button>
                </form>
                <div id="msg-login" class="mt-3 text-xs text-center"></div>
                <div class="mt-6 text-center border-t pt-4"><button onclick="alternarParaCadastro()" class="text-blue-600 hover:underline font-semibold text-xs">Criar Cadastro</button></div>
            </div>
            <div id="form-cadastro-container" class="hidden">
                <h2 class="text-2xl font-extrabold text-gray-900 mb-1 text-center">Criar Nova Conta</h2>
                <form id="form-cadastro" class="space-y-3">
                    <div><label class="block text-xs font-semibold text-gray-700 mb-0.5">Nome Completo</label><input type="text" id="cad-nome" required class="w-full px-3 py-1.5 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-700 mb-0.5">E-mail</label><input type="email" id="cad-email" required class="w-full px-3 py-1.5 border rounded-lg text-sm"></div>
                    <div><label class="block text-xs font-semibold text-gray-700 mb-0.5">Senha</label><input type="password" id="cad-senha" required minlength="6" class="w-full px-3 py-1.5 border rounded-lg text-sm"></div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-0.5">Curso</label>
                        <select id="cad-curso" required class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
                            <option value="Administração">Administração</option>
                            <option value="Administração Pública">Administração Pública</option>
                            <option value="Biblioteconomia">Biblioteconomia</option>
                            <option value="Ciências Contábeis">Ciências Contábeis</option>
                            <option value="Engenharia de Produção">Engenharia de Produção</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-0.5">Semestre de Ingresso</label>
                        <select id="cad-semestre" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white"><option value="">Nenhum</option></select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm mt-2">Criar Conta</button>
                </form>
                <div id="msg-cadastro" class="mt-2 text-xs text-center"></div>
                <div class="mt-4 text-center border-t pt-3"><button onclick="alternarParaLogin()" class="text-blue-600 hover:underline text-xs">← Voltar para o Login</button></div>
            </div>
        </div>
    </div>

    <!-- MODAL ICS -->
    <div id="modal-ics-guia" class="hidden fixed inset-0 bg-black/50 z-[250] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative">
            <button onclick="fecharModalIcsGuia()" class="absolute top-4 right-4 text-gray-400 font-bold text-lg">✕</button>
            <h3 id="ics-guia-titulo" class="text-xl font-extrabold text-gray-900 mb-2">Adicionar Provas à Agenda</h3>
            <div id="ics-guia-conteudo" class="text-sm text-gray-600 space-y-3 mb-6"></div>
            <div class="flex justify-end space-x-3 border-t pt-4">
                <button onclick="fecharModalIcsGuia()" class="px-4 py-2 bg-gray-100 rounded-lg text-xs">Cancelar</button>
                <button id="btn-confirmar-download-ics" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs">Fazer Download (.ics)</button>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="w-full max-w-7xl mx-auto px-6 py-8 flex-1">
        
        <!-- TEASER DO JORNAL BLITZ (1 LINHA COM LARGURA AJUSTADA PARA APARECER QUASE 2 MINIATURAS NO MOBILE) -->
        <section id="teaser-jornal-section" class="mb-8 hidden">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2">
                    <span class="bg-blue-100 text-blue-800 text-[11px] font-extrabold px-2 py-0.5 rounded uppercase">Jornal Blitz</span>
                    <h3 class="text-sm font-bold text-gray-800">Últimas Publicações</h3>
                </div>
                <a href="jornal.html" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition whitespace-nowrap">Ver todas →</a>
            </div>
            
            <div id="teaser-jornal-grid" class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
                <!-- Preenchido via JS -->
            </div>
        </section>

        <div id="app">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Carregando painel...</h2>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let listaDisciplinasGlobal = [];
        let planejamentoGlobal = [];
        let usuarioAtual = null;
        let estruturaInicializada = false;
        let catalogoRecolhido = false;
        let semestreIcsPendente = null;

        async function init() {
            gerarOpcoesSemestresCadastro();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('abrir_login') === '1') abrirModalAuth('login');
            
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { usuarioAtual = session.user; await processarPendenciaCadastro(); }

            renderizarTopoUsuario();
            await carregarTeaserJornal();
            await carregarDadosBanco();

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                usuarioAtual = session ? session.user : null;
                if (usuarioAtual) { await migrarDadosLocaisParaBanco(usuarioAtual.id); await processarPendenciaCadastro(); }
                renderizarTopoUsuario(); await carregarDadosBanco();
            });
        }

        async function carregarTeaserJornal() {
            const { data: posts } = await supabaseClient.from('jornal_posts').select('*').order('criado_em', { ascending: false }).limit(4);
            const section = document.getElementById('teaser-jornal-section');
            const grid = document.getElementById('teaser-jornal-grid');
            if (!posts || posts.length === 0) { section.classList.add('hidden'); return; }

            section.classList.remove('hidden');
            let html = '';
            posts.forEach(post => {
                let dataF = new Date(post.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                // min-w ajustado para 1 miniatura inteira e quase metade da segunda no mobile
                html += `
                    <a href="materia.html?id=${post.id}" class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between group min-w-[175px] sm:min-w-[220px] flex-1 max-w-[280px]">
                        <div>
                            <div class="w-full h-24 bg-gray-100 overflow-hidden relative">
                                ${post.capa_url ? `<img src="${post.capa_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">` : '<div class="w-full h-full flex items-center justify-center text-gray-400 text-xs">Jornal Blitz</div>'}
                                <span class="absolute top-2 left-2 bg-blue-600 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase">${post.categoria}</span>
                            </div>
                            <div class="p-2.5">
                                <span class="text-[10px] text-gray-400">${dataF}</span>
                                <h4 class="font-bold text-gray-800 text-xs mt-0.5 group-hover:text-blue-600 transition line-clamp-2 leading-snug">${post.titulo}</h4>
                            </div>
                        </div>
                        <div class="px-2.5 pb-2.5 pt-0"><span class="text-[10px] font-semibold text-blue-600">Ler notícia →</span></div>
                    </a>
                `;
            });
            grid.innerHTML = html;
        }

        function gerarOpcoesSemestresCadastro() {
            const select = document.getElementById('cad-semestre'); if (!select) return;
            let html = '<option value="">Nenhum</option>';
            for (let ano = 2026; ano >= 2019; ano--) {
                for (let sem = 2; sem >= 1; sem--) {
                    if (ano === 2026 && sem > 2) continue;
                    html += `<option value="${ano}-${sem}">${ano}-${sem}</option>`;
                }
            }
            select.innerHTML = html;
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            const containerBtnAdmin = document.getElementById('container-btn-admin');
            const isAdmin = usuarioAtual && usuarioAtual.user_metadata?.is_admin === true;
            if (isAdmin && containerBtnAdmin) containerBtnAdmin.innerHTML = `<a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">⚙️ Admin</a>`;
            else if (containerBtnAdmin) containerBtnAdmin.innerHTML = '';

            if (!usuarioAtual) {
                bloco.innerHTML = `<button onclick="abrirModalAuth('login')" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700 transition whitespace-nowrap">Entrar / Cadastrar</button>`;
                return;
            }
            const nome = usuarioAtual.user_metadata?.nome || usuarioAtual.email || "Usuário";
            const primeiraLetra = nome.charAt(0).toUpperCase();
            const fotoUrl = usuarioAtual.user_metadata?.foto_url;
            let avatarHtml = fotoUrl ? `<img src="${fotoUrl}" class="w-full h-full object-cover">` : primeiraLetra;

            bloco.innerHTML = `
                <span class="hidden sm:inline text-xs font-medium text-gray-700">${nome.split(' ')[0]}</span>
                <div class="relative">
                    <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs overflow-hidden">${avatarHtml}</button>
                    <div id="dropdown-perfil" class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50 text-sm">
                        <a href="perfil.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Perfil</a>
                        <a href="#" id="btn-sair" class="block px-4 py-2 text-red-600 hover:bg-red-50">Sair</a>
                    </div>
                </div>
            `;
            document.getElementById('btn-avatar-menu').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('dropdown-perfil').classList.toggle('hidden'); });
            window.addEventListener('click', () => { const d = document.getElementById('dropdown-perfil'); if (d && !d.classList.contains('hidden')) d.classList.add('hidden'); });
            document.getElementById('btn-sair').addEventListener('click', async (e) => { e.preventDefault(); await supabaseClient.auth.signOut(); window.location.reload(); });
        }

        function abrirModalAuth(tipo = 'login') { document.getElementById('modal-auth').classList.remove('hidden'); if (tipo === 'cadastro') alternarParaCadastro(); else alternarParaLogin(); }
        function fecharModalAuth() { document.getElementById('modal-auth').classList.add('hidden'); }
        function alternarParaCadastro() { document.getElementById('form-login-container').classList.add('hidden'); document.getElementById('form-cadastro-container').classList.remove('hidden'); }
        function alternarParaLogin() { document.getElementById('form-cadastro-container').classList.add('hidden'); document.getElementById('form-login-container').classList.remove('hidden'); }
        function acaoRequerAuth(e, nome) { e.preventDefault(); if (!usuarioAtual) abrirModalAuth('login'); else alert(`Acessando ${nome}...`); }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: document.getElementById('login-email').value, password: document.getElementById('login-senha').value });
            if (error) { document.getElementById('msg-login').textContent = "Erro: " + error.message; document.getElementById('msg-login').className = "mt-3 text-xs text-center text-red-600"; }
            else { usuarioAtual = data.user; await migrarDadosLocaisParaBanco(usuarioAtual.id); fecharModalAuth(); renderizarTopoUsuario(); await carregarDadosBanco(); await processarPendenciaCadastro(); }
        });

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.signUp({
                email: document.getElementById('cad-email').value, password: document.getElementById('cad-senha').value,
                options: { data: { nome: document.getElementById('cad-nome').value, curso: document.getElementById('cad-curso').value, semestre_ingresso: document.getElementById('cad-semestre').value } }
            });
            if (error) { document.getElementById('msg-cadastro').textContent = "Erro: " + error.message; document.getElementById('msg-cadastro').className = "mt-2 text-xs text-center text-red-600"; return; }
            document.getElementById('msg-cadastro').innerHTML = "✅ Conta criada! Verifique seu e-mail.";
            document.getElementById('msg-cadastro').className = "mt-2 text-xs text-center text-green-600";
        });

        async function migrarDadosLocaisParaBanco(userId) {
            const locais = JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
            if (locais.length === 0) return;
            const reg = locais.map(i => ({ user_id: userId, disciplina_id: i.disciplina_id, semestre: i.semestre, status: i.status || 'Inscrita', sequence: 0 }));
            const { error } = await supabaseClient.from('planejamento_usuarios').insert(reg);
            if (!error) localStorage.removeItem('planejamento_visitante');
        }

        function rolarParaGrade(e) { e.preventDefault(); const a = document.getElementById('secao-grade-disciplinar'); if (a) window.scrollTo({ top: a.getBoundingClientRect().top + window.pageYOffset - 120, behavior: 'smooth' }); }

        async function carregarDadosBanco() {
            const p = [supabaseClient.from('disciplinas').select('*')];
            if (usuarioAtual) p.push(supabaseClient.from('planejamento_usuarios').select('*').eq('user_id', usuarioAtual.id));
            const r = await Promise.all(p);
            listaDisciplinasGlobal = r[0].data || [];
            planejamentoGlobal = usuarioAtual ? (r[1]?.data || []) : JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
            if (!estruturaInicializada) { renderizarEstruturaPrincipal(); estruturaInicializada = true; }
            else { renderizarTabelaCatalogo(); renderizarSemestresAlocados(); }
        }

        function formatarDataHoraCell(txt) {
            if (!txt || txt.trim() === '-' || txt.trim() === '') return '<div class="text-center">-</div>';
            let l = txt.trim().replace(/\s*-\s*/g, ' '); let p = l.split(/\s+/);
            if (p.length >= 2) return `<div class="text-center leading-tight"><div>${p[0]}</div><div class="text-xs text-gray-500">${p.slice(1).join(' ')}</div></div>`;
            return `<div class="text-center">${txt}</div>`;
        }

        function renderizarEstruturaPrincipal() {
            document.getElementById('app').innerHTML = `
                <div class="mb-10">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-2xl font-bold text-gray-800">Catálogo de Disciplinas e Conflitos</h2>
                        <button id="btn-toggle-catalogo" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-3 py-1.5 rounded-lg transition">${catalogoRecolhido ? '▼ Expandir Lista' : '▲ Recolher Lista'}</button>
                    </div>
                    <p class="text-gray-600 text-sm mb-4">Marque as disciplinas desejadas. Conflitos de APs ficarão destacados em amarelo.</p>
                    <div id="wrapper-catalogo" class="bg-white shadow-md rounded-xl overflow-x-auto border border-gray-100" style="display: ${catalogoRecolhido ? 'none' : 'block'};">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
                                    <th class="p-3 border-b text-center w-12">Selec.</th>
                                    <th class="p-3 border-b">Código</th>
                                    <th class="p-3 border-b">Disciplina</th>
                                    <th class="p-3 border-b text-center">Data AP1</th>
                                    <th class="p-3 border-b text-center">Data AP2</th>
                                    <th class="p-3 border-b text-center">Data AP3</th>
                                    <th class="p-3 border-b text-center">Período</th>
                                    <th class="p-3 border-b text-center">Status Salvo</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-disciplinas"><tr><td colspan="8" class="p-6 text-center text-gray-500">Carregando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
                <div id="secao-grade-disciplinar">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-gray-800">Disciplinas Alocadas por Semestre</h2>
                        <button onclick="exportarGradeCompletaPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm">📥 Exportar Planejamento (PDF)</button>
                    </div>
                    <div id="container-semestres" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start"></div>
                </div>
            `;
            document.getElementById('btn-cadastrar-semestre').addEventListener('click', cadastrarSelecionadasNoSemestre);
            document.getElementById('btn-toggle-catalogo').addEventListener('click', () => {
                catalogoRecolhido = !catalogoRecolhido;
                document.getElementById('wrapper-catalogo').style.display = catalogoRecolhido ? 'none' : 'block';
                document.getElementById('btn-toggle-catalogo').textContent = catalogoRecolhido ? '▼ Expandir Lista' : '▲ Recolher Lista';
            });
            renderizarTabelaCatalogo(); renderizarSemestresAlocados();
        }

        function renderizarTabelaCatalogo() {
            const tbody = document.getElementById('tabela-disciplinas');
            if (!tbody || listaDisciplinasGlobal.length === 0) return;
            const checkboxes = Array.from(document.querySelectorAll('.check-disciplina:checked')).map(cb => parseInt(cb.value));
            const horariosOcupados = new Set();
            listaDisciplinasGlobal.forEach(d => {
                if (checkboxes.includes(d.id)) {
                    if (d.data_ap1?.trim()) horariosOcupados.add(d.data_ap1.trim());
                    if (d.data_ap2?.trim()) horariosOcupados.add(d.data_ap2.trim());
                    if (d.data_ap3?.trim()) horariosOcupados.add(d.data_ap3.trim());
                }
            });
            const statusMap = {}; planejamentoGlobal.forEach(p => { statusMap[p.disciplina_id] = p; });
            let html = '';
            listaDisciplinasGlobal.forEach(disc => {
                const jaSalvo = statusMap[disc.id]; const estaMarcada = checkboxes.includes(disc.id); const indisponivel = (disc.controle === 0 || disc.controle === '0');
                let temConflito = !estaMarcada && horariosOcupados.size > 0 && ((disc.data_ap1 && horariosOcupados.has(disc.data_ap1.trim())) || (disc.data_ap2 && horariosOcupados.has(disc.data_ap2.trim())) || (disc.data_ap3 && horariosOcupados.has(disc.data_ap3.trim())));
                let badge = jaSalvo ? `<span class="px-2.5 py-1 rounded-full text-xs font-semibold ${jaSalvo.status === 'Cursada' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}">${jaSalvo.status} (${jaSalvo.semestre})</span>` : '<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">Não alocada</span>';
                
                html += `
                    <tr class="border-b hover:bg-gray-50 transition text-sm ${temConflito ? 'bg-amber-50 border-l-4 border-l-amber-500' : ''}">
                        <td class="p-3 text-center align-middle"><input type="checkbox" value="${disc.id}" class="check-disciplina w-4 h-4 text-blue-600 rounded border-gray-300 ${jaSalvo ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}" ${estaMarcada ? 'checked' : ''} ${jaSalvo ? 'disabled' : ''}></td>
                        <td class="p-3 font-mono align-middle">${disc.codigo || '-'}</td>
                        <td class="p-3 font-medium align-middle"><div>${disc.nome}</div>${temConflito ? '<span class="text-xs bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-semibold inline-block mt-1">⚠️ Conflito de Horário</span>' : ''}</td>
                        ${indisponivel ? '<td colspan="3" class="p-3 text-center text-xs font-semibold text-gray-500 italic align-middle">Não disponível</td>' : `<td class="p-3 text-gray-600 align-middle">${formatarDataHoraCell(disc.data_ap1)}</td><td class="p-3 text-gray-600 align-middle">${formatarDataHoraCell(disc.data_ap2)}</td><td class="p-3 text-gray-600 align-middle">${formatarDataHoraCell(disc.data_ap3)}</td>`}
                        <td class="p-3 text-center align-middle">${disc.periodo || '-'}</td>
                        <td class="p-3 text-center align-middle">${badge}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            tbody.querySelectorAll('.check-disciplina:not(:disabled)').forEach(cb => cb.addEventListener('change', renderizarTabelaCatalogo));
        }

        async function cadastrarSelecionadasNoSemestre() {
            const semestre = document.getElementById('select-semestre-destino').value;
            const marcados = Array.from(document.querySelectorAll('.check-disciplina:checked')).map(cb => parseInt(cb.value));
            if (!semestre) { alert("Selecione um semestre de destino."); return; }
            if (marcados.length === 0) { alert("Marque ao menos uma disciplina."); return; }

            if (!usuarioAtual) {
                if (semestre === '1º Semestre') {
                    let locais = JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
                    marcados.forEach(id => { if (!locais.some(i => i.disciplina_id === id)) locais.push({ disciplina_id: id, semestre, status: 'Inscrita', sequence: 0 }); });
                    localStorage.setItem('planejamento_visitante', JSON.stringify(locais));
                    document.getElementById('select-semestre-destino').value = "";
                    document.querySelectorAll('.check-disciplina').forEach(cb => cb.checked = false);
                    document.getElementById('mensagem-sucesso-global').classList.remove('hidden');
                    setTimeout(() => document.getElementById('mensagem-sucesso-global').classList.add('hidden'), 4000);
                    await carregarDadosBanco(); return;
                } else {
                    sessionStorage.setItem('pendencia_cadastro', JSON.stringify({ semestre, disciplinas: marcados }));
                    alert("Para adicionar a partir do 2º semestre, é necessário fazer login.");
                    abrirModalAuth('login'); return;
                }
            }
            await executarCadastroNoBanco(usuarioAtual.id, semestre, marcados);
        }

        async function executarCadastroNoBanco(userId, semestre, marcados) {
            const reg = marcados.map(id => ({ user_id: userId, disciplina_id: id, semestre, status: 'Inscrita', sequence: 0 }));
            const { error } = await supabaseClient.from('planejamento_usuarios').insert(reg);
            if (error) { alert("Erro: " + error.message); return; }
            document.getElementById('select-semestre-destino').value = "";
            document.querySelectorAll('.check-disciplina').forEach(cb => cb.checked = false);
            document.getElementById('mensagem-sucesso-global').classList.remove('hidden');
            setTimeout(() => document.getElementById('mensagem-sucesso-global').classList.add('hidden'), 4000);
            await carregarDadosBanco();
        }

        async function processarPendenciaCadastro() {
            const p = sessionStorage.getItem('pendencia_cadastro');
            if (!p || !usuarioAtual) return;
            try {
                const obj = JSON.parse(p);
                if (obj?.semestre && obj?.disciplinas?.length > 0) await executarCadastroNoBanco(usuarioAtual.id, obj.semestre, obj.disciplinas);
            } catch (e) { console.error(e); } finally { sessionStorage.removeItem('pendencia_cadastro'); }
        }

        function renderizarSemestresAlocados() {
            const container = document.getElementById('container-semestres');
            if (!container) return; container.innerHTML = '';
            const semestres = ['1º Semestre', '2º Semestre', '3º Semestre', '4º Semestre', '5º Semestre', '6º Semestre', '7º Semestre', '8º Semestre', '9º Semestre', '10º Semestre'];

            semestres.forEach(sem => {
                const reg = planejamentoGlobal.filter(p => p.semestre === sem).sort((a, b) => listaDisciplinasGlobal.findIndex(d => d.id === a.disciplina_id) - listaDisciplinasGlobal.findIndex(d => d.id === b.disciplina_id));
                let htmlItens = reg.length === 0 ? '<p class="text-xs text-gray-400 italic">Nenhuma disciplina alocada.</p>' : '<ul class="space-y-2 mb-3">';
                reg.forEach(r => {
                    const d = listaDisciplinasGlobal.find(i => i.id === r.disciplina_id); if (!d) return;
                    htmlItens += `
                        <li class="flex justify-between items-center text-sm border-b pb-2 rounded px-2 py-1">
                            <div><span class="font-mono text-xs text-gray-500 mr-2">${d.codigo}</span><span class="font-medium text-gray-800">${d.nome}</span></div>
                            <div class="flex items-center space-x-2">
                                <select onchange="atualizarStatusIndividual(${d.id}, this.value)" class="text-xs border rounded px-2 py-1 ${r.status === 'Cursada' ? 'text-green-600 bg-green-50' : 'text-blue-600 bg-blue-50'}"><option value="Inscrita" ${r.status === 'Inscrita' ? 'selected' : ''}>Inscrita</option><option value="Cursada" ${r.status === 'Cursada' ? 'selected' : ''}>Cursada</option></select>
                                ${r.status !== 'Cursada' ? `<button onclick="removerDoSemestre(${d.id})" class="text-red-500 hover:text-red-700 text-xs font-bold px-1">✕</button>` : ''}
                            </div>
                        </li>
                    `;
                });
                if (reg.length > 0) htmlItens += '</ul>';

                container.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm flex flex-col">
                        <div class="flex justify-between items-center mb-3 border-b pb-2">
                            <div class="flex items-center space-x-2"><h3 class="font-bold text-gray-800">${sem}</h3><span class="text-xs bg-blue-50 text-blue-700 font-semibold px-2 py-0.5 rounded-full">${reg.length}</span></div>
                            ${reg.some(r => r.status === 'Inscrita') ? `<button onclick="limparSemestre('${sem}')" class="text-xs text-red-600 bg-red-50 hover:bg-red-100 px-2 py-1 rounded font-semibold transition">Limpar Inscritas</button>` : ''}
                        </div>
                        ${htmlItens}
                        ${reg.length > 0 ? `<div class="flex justify-center items-center mt-auto pt-3 space-x-2"><button onclick="exportarSemestrePDF('${sem}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 rounded-lg">🖨️ PDF</button><button onclick="iniciarExportacaoICS('${sem}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2 px-3 rounded-lg">📅 Agenda</button></div>` : ''}
                    </div>
                `;
            });
        }

        async function atualizarStatusIndividual(id, status) {
            if (!usuarioAtual) {
                let l = JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
                const i = l.find(x => x.disciplina_id === id); if (i) { i.status = status; localStorage.setItem('planejamento_visitante', JSON.stringify(l)); await carregarDadosBanco(); }
                return;
            }
            await supabaseClient.from('planejamento_usuarios').update({ status }).eq('user_id', usuarioAtual.id).eq('disciplina_id', id);
            await carregarDadosBanco();
        }

        async function removerDoSemestre(id) {
            if (!confirm("Remover disciplina?")) return;
            if (!usuarioAtual) {
                let l = JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
                localStorage.setItem('planejamento_visitante', JSON.stringify(l.filter(x => x.disciplina_id !== id)));
                await carregarDadosBanco(); return;
            }
            await supabaseClient.from('planejamento_usuarios').delete().eq('user_id', usuarioAtual.id).eq('disciplina_id', id);
            await carregarDadosBanco();
        }

        async function limparSemestre(sem) {
            if (!confirm(`Limpar ${sem}?`)) return;
            if (!usuarioAtual) {
                let l = JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
                localStorage.setItem('planejamento_visitante', JSON.stringify(l.filter(x => !(x.semestre === sem && x.status === 'Inscrita'))));
                await carregarDadosBanco(); return;
            }
            await supabaseClient.from('planejamento_usuarios').delete().eq('user_id', usuarioAtual.id).eq('semestre', sem).eq('status', 'Inscrita');
            await carregarDadosBanco();
        }

        function exportarSemestrePDF(sem) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF({ orientation: 'landscape' });
            const reg = planejamentoGlobal.filter(p => p.semestre === sem);
            doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("Grade de Disciplinas - " + sem, 14, 15);
            let y = 30; doc.setFillColor(235, 240, 245); doc.rect(14, y - 4, 269, 7, "F");
            doc.text("Código", 16, y); doc.text("Nome da Disciplina", 42, y); doc.text("Data AP1", 130, y); doc.text("Data AP2", 175, y); doc.text("Data AP3", 220, y); doc.text("Status", 283, y, { align: "right" });
            y += 7; doc.setFont("helvetica", "normal");
            reg.forEach(r => {
                const d = listaDisciplinasGlobal.find(i => i.id === r.disciplina_id); if (!d) return;
                doc.text(d.codigo || '-', 16, y); doc.text((d.nome || '-').substring(0, 42), 42, y);
                doc.text(d.data_ap1 || '-', 130, y); doc.text(d.data_ap2 || '-', 175, y); doc.text(d.data_ap3 || '-', 220, y);
                doc.text(r.status || 'Inscrita', 283, y, { align: "right" }); y += 8;
            });
            doc.save(`grade_${sem.toLowerCase().replace(' ', '_')}.pdf`);
        }

        function parseDataHoraStrICS(str) {
            const m = str?.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s*-\s*(\d{1,2}):(\d{2})\s*(?:às|as)\s*(\d{1,2}):(\d{2})$/i);
            if (!m) return null;
            const d = new Date(Date.UTC(+m[3], +m[2]-1, +m[1], +m[4]+3, +m[5], 0));
            const fmt = (hr, mn) => { let x = new Date(Date.UTC(+m[3], +m[2]-1, +m[1], hr+3, mn, 0)); return `${x.getUTCFullYear()}${String(x.getUTCMonth()+1).padStart(2,'0')}${String(x.getUTCDate()).padStart(2,'0')}T${String(x.getUTCHours()).padStart(2,'0')}${String(x.getUTCMinutes()).padStart(2,'0')}00Z`; };
            return { dateObj: d, diaStr: m[1], mesStr: m[2], anoStr: m[3], horarioInicioCompleto: `${m[4]}h`, dtstart: fmt(+m[4], +m[5]), dtend: fmt(+m[6], +m[7]) };
        }

        function iniciarExportacaoICS(sem) {
            semestreIcsPendente = sem;
            document.getElementById('ics-guia-conteudo').innerHTML = `<p class="text-xs text-gray-600">Baixe o arquivo de eventos de provas para o seu calendário.</p>`;
            document.getElementById('modal-ics-guia').classList.remove('hidden');
        }
        function fecharModalIcsGuia() { document.getElementById('modal-ics-guia').classList.add('hidden'); }

        document.getElementById('btn-confirmar-download-ics').addEventListener('click', async () => {
            const sem = semestreIcsPendente; fecharModalIcsGuia();
            const reg = planejamentoGlobal.filter(p => p.semestre === sem);
            let eventos = [];
            ['AP1', 'AP2'].forEach(tipo => {
                reg.forEach(r => {
                    const d = listaDisciplinasGlobal.find(i => i.id === r.disciplina_id); if (!d || d.controle === 0) return;
                    const p = parseDataHoraStrICS(tipo === 'AP1' ? d.data_ap1 : d.data_ap2);
                    if (p) {
                        eventos.push('BEGIN:VEVENT', `UID:${d.id}-${tipo}@eadblitz.com.br`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`, `DTSTART:${p.dtstart}`, `DTEND:${p.dtend}`, `SUMMARY:Prova ${tipo} - ${d.nome}`, 'END:VEVENT');
                    }
                });
            });
            const blob = new Blob([['BEGIN:VCALENDAR', 'VERSION:2.0', ...eventos, 'END:VCALENDAR'].join('\r\n')], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `provas_${sem.toLowerCase().replace(' ', '_')}.ics`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });

        init();
    </script>
</body>
</html>
