<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EADBlitz - Planejamento Acadêmico</title>
    
    <!-- Tailwind CSS para Estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- jsPDF para exportação em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- HEADER / NAVEGAÇÃO -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-xl font-bold">
                    <i class="fa-solid fa-graduation-cap"></i> EADBlitz
                </div>
                <span class="text-xs bg-indigo-800 px-2 py-1 rounded text-indigo-200">Planejamento Acadêmico</span>
            </div>
            
            <div id="auth-container" class="flex items-center space-x-3 mt-2 sm:mt-0">
                <!-- Conteúdo injetado via JS (Login/Logout/Perfil) -->
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Alerta para visitantes -->
        <div id="banner-visitante" class="hidden mb-6 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500 text-xl"></i>
                    <p class="text-sm text-amber-700">Você está navegando como visitante. Suas alterações ficam salvas apenas neste navegador.</p>
                </div>
                <button onclick="abrirModalAuth('cadastro')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition">
                    Criar Conta Gratuita
                </button>
            </div>
        </div>

        <!-- Seção de Semestres e Disciplinas -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <h1 class="text-2xl font-bold text-slate-900"><i class="fa-solid fa-calendar-days text-indigo-600 mr-2"></i> Meu Planejamento</h1>
            
            <div class="flex items-center space-x-2 flex-wrap gap-2">
                <button onclick="adicionarSemestre()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i> <span>Novo Semestre</span>
                </button>
            </div>
        </div>

        <!-- Container onde os semestres serão renderizados -->
        <div id="container-semestres" class="space-y-8">
            <!-- Renderizado dinamicamente -->
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-12 text-center text-xs text-slate-500">
        <p>&copy; 2026 EADBlitz. Todos os direitos reservados.</p>
    </footer>

    <!-- MODAL DE AUTENTICAÇÃO -->
    <div id="modal-auth" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
            <button onclick="fecharModalAuth()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div id="conteudo-modal-auth">
                <!-- Conteúdo de login/cadastro injetado via JS -->
            </div>
        </div>
    </div>

    <!-- SCRIPT COMPLETO DA APLICAÇÃO -->
    <script>
        // Configuração do Supabase (Substitua pelas suas chaves reais se necessário)
        const SUPABASE_URL = 'SUA_SUPABASE_URL_AQUI';
        const SUPABASE_ANON_KEY = 'SUA_SUPABASE_ANON_KEY_AQUI';
        const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL !== 'SUA_SUPABASE_URL_AQUI') 
            ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        let usuarioAtual = null;
        let planejamentoGlobal = [];
        let listaDisciplinasGlobal = [];

        // Inicialização básica ao carregar a página
        document.addEventListener('DOMContentLoaded', async () => {
            await verificarSessao();
            await carregarDadosBanco();
            renderizarApp();
        });

        async function verificarSessao() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            usuarioAtual = session ? session.user : null;
            atualizarHeaderAuth();
        }

        function atualizarHeaderAuth() {
            const container = document.getElementById('auth-container');
            const banner = document.getElementById('banner-visitante');

            if (usuarioAtual) {
                if (banner) banner.classList.add('hidden');
                container.innerHTML = `
                    <span class="text-xs text-indigo-200 hidden sm:inline">${usuarioAtual.email}</span>
                    <button onclick="fazerLogout()" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded transition">Sair</button>
                `;
            } else {
                if (banner) banner.classList.remove('hidden');
                container.innerHTML = `
                    <button onclick="abrirModalAuth('login')" class="text-xs bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded transition">Entrar</button>
                    <button onclick="abrirModalAuth('cadastro')" class="text-xs bg-white text-indigo-900 font-semibold px-3 py-1.5 rounded hover:bg-indigo-50 transition">Cadastrar</button>
                `;
            }
        }

        async function carregarDadosBanco() {
            // Mock de dados locais ou carregamento real do banco para testes
            listaDisciplinasGlobal = [
                { id: 1, codigo: 'ADM101', nome: 'Introdução à Administração', controle: 1, data_ap1: '15/04/2026 das 14:00 às 16:00', data_ap2: '15/06/2026 das 14:00 às 16:00' },
                { id: 2, codigo: 'ADM102', nome: 'Contabilidade Geral', controle: 1, data_ap1: '16/04/2026 das 09:00 às 11:00', data_ap2: '16/06/2026 das 09:00 às 11:00' }
            ];
            
            planejamentoGlobal = [
                { semestre: 'Semestre 1', disciplina_id: 1, sequence: 1 },
                { semestre: 'Semestre 1', disciplina_id: 2, sequence: 1 }
            ];
        }

        function renderizarApp() {
            const container = document.getElementById('container-semestres');
            container.innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800">Semestre 1</h2>
                        <button onclick="exportarSemestreICS('Semestre 1')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-calendar-arrow-down"></i> <span>Exportar Calendário (ICS)</span>
                        </button>
                    </div>
                    <p class="text-sm text-slate-500">Disciplinas e provas organizadas para este semestre.</p>
                </div>
            `;
        }

        function adicionarSemestre() {
            alert("Função de adicionar novo semestre ativada.");
        }

        function abrirModalAuth(tipo) {
            const modal = document.getElementById('modal-auth');
            const conteudo = document.getElementById('conteudo-modal-auth');
            modal.classList.remove('hidden');
            conteudo.innerHTML = `<h3 class="text-lg font-bold mb-4">${tipo === 'login' ? 'Entrar na EADBlitz' : 'Criar Conta'}</h3><p class="text-sm text-slate-500">Módulo de autenticação ativo.</p>`;
        }

        function fecharModalAuth() {
            document.getElementById('modal-auth').classList.add('hidden');
        }

        async function fazerLogout() {
            if (supabaseClient) await supabaseClient.auth.signOut();
            usuarioAtual = null;
            atualizarHeaderAuth();
        }

        // ==========================================
        // FUNÇÕES CORRIGIDAS DE EXPORTAÇÃO .ICS
        // ==========================================

        function parseDataHoraStr(str) {
            if (!str) return null;
            let limpo = str.trim();

            let regexMatch = limpo.match(/(\d{2})\/(\d{2})\/(\d{4})/);
            if (!regexMatch) return null;

            let dia = parseInt(regexMatch[1], 10);
            let mes = parseInt(regexMatch[2], 10) - 1;
            let ano = parseInt(regexMatch[3], 10);

            let horariosEncontrados = limpo.match(/\d{2}:\d{2}/g);
            
            let horaInicio = 8, minInicio = 0;
            let horaFim = 10, minFim = 0;

            if (horariosEncontrados && horariosEncontrados.length > 0) {
                let partesInicio = horariosEncontrados[0].split(':');
                horaInicio = parseInt(partesInicio[0], 10);
                minInicio = parseInt(partesInicio[1], 10);

                if (horariosEncontrados.length > 1) {
                    let partesFim = horariosEncontrados[1].split(':');
                    horaFim = parseInt(partesFim[0], 10);
                    minFim = parseInt(partesFim[1], 10);
                } else {
                    let dtTemp = new Date(ano, mes, dia, horaInicio, minInicio, 0);
                    dtTemp.setHours(dtTemp.getHours() + 2);
                    horaFim = dtTemp.getHours();
                    minFim = dtTemp.getMinutes();
                }
            }

            const dtInicio = new Date(ano, mes, dia, horaInicio, minInicio, 0);
            const dtFim = new Date(ano, mes, dia, horaFim, minFim, 0);

            if (dtFim <= dtInicio) {
                dtFim.setTime(dtInicio.getTime() + 2 * 60 * 60 * 1000);
            }

            return { dtInicio, dtFim };
        }

        function formatarDataICal(dateObj) {
            const ano = dateObj.getFullYear();
            const mes = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dia = String(dateObj.getDate()).padStart(2, '0');
            const hora = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            const seg = String(dateObj.getSeconds()).padStart(2, '0');
            return `${ano}${mes}${dia}T${hora}${min}${seg}`;
        }

        async function exportarSemestreICS(semestreNome) {
            if (!usuarioAtual) {
                alert("Para exportar o calendário em .ics, é necessário estar logado. Por favor, entre ou crie sua conta.");
                abrirModalAuth('login');
                return;
            }

            const scrollSalvo = window.scrollY;
            const registros = planejamentoGlobal.filter(p => p.semestre === semestreNome);

            if (registros.length === 0) {
                alert("Não há disciplinas neste semestre para gerar o calendário.");
                return;
            }

            const now = new Date();
            const anoVigente = now.getFullYear();
            const semestreVigenteNum = (now.getMonth() + 1) >= 6 ? 2 : 1;
            const codigoSemestreFormatado = `${anoVigente}${semestreVigenteNum}`;
            const semestreTextoFormatado = `${anoVigente}-${semestreVigenteNum}`;

            let eventosIcs = [];
            let atualizacoesSequenciais = [];

            registros.forEach(reg => {
                const disc = listaDisciplinasGlobal.find(item => item.id === reg.disciplina_id);
                if (!disc) return;

                if (disc.controle === 0 || disc.controle === '0') return;

                const codigoDisc = disc.codigo || 'GERAL';
                const nomeDisc = disc.nome || 'Disciplina';
                const uidUnico = `${codigoDisc}${codigoSemestreFormatado}@eadblitz.com.br`;

                const novaSequence = (reg.sequence || 0) + 1;
                atualizacoesSequenciais.push({
                    disciplina_id: reg.disciplina_id,
                    semestre: reg.semestre,
                    sequence: novaSequence
                });

                const dtstampStr = formatarDataICal(new Date()) + 'Z';

                // Processar AP1 com alarmes corrigidos -P7D e -P2D
                const datasAp1 = parseDataHoraStr(disc.data_ap1);
                if (datasAp1) {
                    let summaryAp1 = `Prova AP1 ${nomeDisc} ${semestreTextoFormatado}`;
                    
                    eventosIcs.push(`BEGIN:VEVENT
UID:${uidUnico}-AP1
DTSTAMP:${dtstampStr}
SEQUENCE:${novaSequence}
DTSTART;TZID=America/Sao_Paulo:${formatarDataICal(datasAp1.dtInicio)}
DTEND;TZID=America/Sao_Paulo:${formatarDataICal(datasAp1.dtFim)}
SUMMARY:${summaryAp1}
DESCRIPTION:Avaliação Presencial 1 da disciplina ${nomeDisc}
URL:https://www.eadblitz.com.br
CATEGORIES:Provas
ORGANIZER;CN="BlitzEAD":mailto:blitzead@gmail.com
STATUS:CONFIRMED
TRANSP:OPAQUE
BEGIN:VALARM
TRIGGER:-P7D
ACTION:DISPLAY
DESCRIPTION:Lembrete: Prova AP1 em 7 dias (${nomeDisc})
END:VALARM
BEGIN:VALARM
TRIGGER:-P7D
ACTION:EMAIL
SUMMARY:Lembrete de Prova AP1 em 7 dias
DESCRIPTION:A prova AP1 da disciplina ${nomeDisc} ocorrerá em 7 dias.
ATTENDEE:mailto:${usuarioAtual.email}
END:VALARM
BEGIN:VALARM
TRIGGER:-P2D
ACTION:DISPLAY
DESCRIPTION:Lembrete: Prova AP1 em 2 dias (${nomeDisc})
END:VALARM
END:VEVENT`);
                }

                // Processar AP2 com alarmes corrigidos -P7D e -P2D
                const datasAp2 = parseDataHoraStr(disc.data_ap2);
                if (datasAp2) {
                    let summaryAp2 = `Prova AP2 ${nomeDisc} ${semestreTextoFormatado}`;
                    
                    eventosIcs.push(`BEGIN:VEVENT
UID:${uidUnico}-AP2
DTSTAMP:${dtstampStr}
SEQUENCE:${novaSequence}
DTSTART;TZID=America/Sao_Paulo:${formatarDataICal(datasAp2.dtInicio)}
DTEND;TZID=America/Sao_Paulo:${formatarDataICal(datasAp2.dtFim)}
SUMMARY:${summaryAp2}
DESCRIPTION:Avaliação Presencial 2 da disciplina ${nomeDisc}
URL:https://www.eadblitz.com.br
CATEGORIES:Provas
ORGANIZER;CN="BlitzEAD":mailto:blitzead@gmail.com
STATUS:CONFIRMED
TRANSP:OPAQUE
BEGIN:VALARM
TRIGGER:-P7D
ACTION:DISPLAY
DESCRIPTION:Lembrete: Prova AP2 em 7 dias (${nomeDisc})
END:VALARM
BEGIN:VALARM
TRIGGER:-P7D
ACTION:EMAIL
SUMMARY:Lembrete de Prova AP2 em 7 dias
DESCRIPTION:A prova AP2 da disciplina ${nomeDisc} ocorrerá em 7 dias.
ATTENDEE:mailto:${usuarioAtual.email}
END:VALARM
BEGIN:VALARM
TRIGGER:-P2D
ACTION:DISPLAY
DESCRIPTION:Lembrete: Prova AP2 em 2 dias (${nomeDisc})
END:VALARM
END:VEVENT`);
                }
            });

            if (eventosIcs.length === 0) {
                alert("Nenhuma data de AP válida encontrada nas disciplinas deste semestre.");
                return;
            }

            if (supabaseClient) {
                for (let att of atualizacoesSequenciais) {
                    await supabaseClient.from('planejamento_usuarios')
                        .update({ sequence: att.sequence })
                        .eq('user_id', usuarioAtual.id)
                        .eq('disciplina_id', att.disciplina_id)
                        .eq('semestre', att.semestre);
                }
            }

            const conteudoIcs = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//BlitzEAD//Planejamento Academico//PT',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                'X-WR-CALNAME:Provas - ' + semestreNome,
                'X-WR-TIMEZONE:America/Sao_Paulo',
                'BEGIN:VTIMEZONE',
                'TZID:America/Sao_Paulo',
                'BEGIN:DAYLIGHT',
                'TZOFFSETFROM:-0300',
                'TZOFFSETTO:-0200',
                'TZNAME:BRST',
                'DTSTART:20071009T000000',
                'RRULE:FREQ=YEARLY;BYDAY=2SU;BYMONTH=10',
                'END:DAYLIGHT',
                'BEGIN:STANDARD',
                'TZOFFSETFROM:-0200',
                'TZOFFSETTO:-0300',
                'TZNAME:BRT',
                'DTSTART:20080215T000000',
                'RRULE:FREQ=YEARLY;BYDAY=3SU;BYMONTH=2',
                'END:STANDARD',
                'END:VTIMEZONE',
                ...eventosIcs,
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([conteudoIcs], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `provas_${semestreNome.toLowerCase().replace(' ', '_')}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            window.scrollTo({ top: scrollSalvo });
        }
    </script>
</body>
</html>
