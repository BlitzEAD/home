name: Gerador de Páginas do Jornal

on:
  workflow_dispatch: # Permite que você rode o script manualmente com um botão
  repository_dispatch:
    types: [atualizar_jornal] # Permite que o Supabase acione este script no futuro

jobs:
  build-paginas:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para o robô salvar os arquivos HTML criados

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Supabase
        run: npm install @supabase/supabase-js

      - name: Rodar o Construtor (build.js)
        run: node build.js

      - name: Salvar novas páginas HTML no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-build: Gerando páginas HTML das matérias do Jornal"
