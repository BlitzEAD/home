<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - Planejamento Acadêmico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- TOPO ADMIN -->
    <header class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <h1 class="text-base font-extrabold text-blue-600">Painel Administrativo</h1>
            <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded">Admin</span>
        </div>
        <div>
            <a href="index.html" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2 rounded-lg transition">
                ← Voltar para o Site
            </a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="w-full max-w-4xl mx-auto px-4 py-8 flex-1">
        
        <!-- MENSAGEM DE ALERTA DE SEGURANÇA / CARREGANDO -->
        <div id="painel-loading" class="bg-white rounded-xl shadow-md p-8 text-center">
            <p class="text-gray-600 font-medium">Verificando permissões de administrador...</p>
        </div>

        <!-- CONTEÚDO REAL DO PAINEL (Oculto até validar admin) -->
        <div id="painel-conteudo" class="hidden space-y-8">
            
            <!-- CABEÇALHO DA SEÇÃO -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-1">Gerenciamento da Biblioteca</h2>
                <p class="text-xs text-gray-500">Cadastre novos livros, apostilas ou materiais complementares para os alunos.</p>
            </div>

            <!-- FORMULÁRIO DE CADASTRO DE LIVRO -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 pb-2 border-b">Cadastrar Novo Livro / Material</h3>

                <form id="form-cadastro-livro" class="space-y-4">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Título do Livro / Material *</label>
                            <input type="text" id="livro-titulo" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ex: Introdução à Administração">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Preço (R$) (Digite 0 para Gratuito) *</label>
                            <input type="number" step="0.01" min="0" id="livro-preco" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" value="0.00">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Descrição Detalhada / Sinopse</label>
                        <textarea id="livro-descricao" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Escreva os detalhes, ementa ou informações do material..."></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Imagem da Capa (Arquivo de Imagem) *</label>
                            <input type="file" id="livro-capa-file" accept="image/*" required class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Arquivo PDF (Se for Gratuito) ou Link Kiwify (Se for Pago)</label>
                            <input type="file" id="livro-pdf-file" accept="application/pdf" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer mb-1">
                            <input type="url" id="livro-link-externo" class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ou cole o link direto da Kiwify / Site Externo aqui">
                        </div>
                    </div>

                    <!-- VÍNCULO COM DISCIPLINAS -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Vincular a Disciplinas (Selecione uma ou mais, ou nenhuma para "Geral")</label>
                        <div id="lista-checkbox-disciplinas" class="max-h-48 overflow-y-auto border border-gray-200 rounded-lg p-3 space-y-2 bg-gray-50 text-xs">
                            <span class="text-gray-400 italic">Carregando disciplinas...</span>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="btn-salvar-livro" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm shadow-sm">
                            Salvar e Publicar Livro
                        </button>
                    </div>

                </form>
                <div id="msg-cadastro-livro" class="mt-3 text-xs text-center font-medium"></div>

            </div>

        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initAdmin() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                alert("Você precisa estar logado para acessar esta página.");
                window.location.href = 'index.html';
                return;
            }

            const usuario = session.user;
            const isAdmin = usuario && usuario.user_metadata && usuario.user_metadata.is_admin === true;

            if (!isAdmin) {
                alert("Acesso negado. Apenas administradores podem acessar esta área.");
                window.location.href = 'index.html';
                return;
            }

            // Se passou, exibe o painel e carrega as disciplinas
            document.getElementById('painel-loading').classList.add('hidden');
            document.getElementById('painel-conteudo').classList.remove('hidden');

            await carregarDisciplinasCheckbox();
        }

        async function carregarDisciplinasCheckbox() {
            const container = document.getElementById('lista-checkbox-disciplinas');
            const { data, error } = await supabaseClient.from('disciplinas').select('id, codigo, nome').order('nome');

            if (error || !data || data.length === 0) {
                container.innerHTML = '<span class="text-red-500">Erro ao carregar disciplinas.</span>';
                return;
            }

            let html = '';
            data.forEach(disc => {
                html += `
                    <label class="flex items-center space-x-2 cursor-pointer hover:bg-gray-100 p-1 rounded">
                        <input type="checkbox" name="disciplina_checkbox" value="${disc.id}" class="w-3.5 h-3.5 text-blue-600 rounded border-gray-300">
                        <span class="font-mono text-gray-500">${disc.codigo || ''}</span>
                        <span class="font-medium text-gray-700">${disc.nome}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        document.getElementById('form-cadastro-livro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-livro');
            const msg = document.getElementById('msg-cadastro-livro');
            
            btn.disabled = true;
            btn.textContent = "Enviando arquivos e salvando...";
            msg.textContent = "";

            try {
                const titulo = document.getElementById('livro-titulo').value;
                const preco = parseFloat(document.getElementById('livro-preco').value) || 0.00;
                const descricao = document.getElementById('livro-descricao').value;
                const linkExterno = document.getElementById('livro-link-externo').value.trim();
                const capaFile = document.getElementById('livro-capa-file').files[0];
                const pdfFile = document.getElementById('livro-pdf-file').files[0];

                if (!capaFile) {
                    throw new Error("A imagem da capa é obrigatória.");
                }

                // 1. Upload da Capa para o Storage do Supabase
                const nomeCapaUnico = `capas/${Date.now()}_${capaFile.name.replace(/\s+/g, '_')}`;
                const { data: uploadCapaData, error: uploadCapaError } = await supabaseClient.storage
                    .from('biblioteca')
                    .upload(nomeCapaUnico, capaFile);

                if (uploadCapaError) throw new Error("Erro ao enviar capa: " + uploadCapaError.message);

                const { data: { publicUrl: capaUrl } } = supabaseClient.storage
                    .from('biblioteca')
                    .getPublicUrl(nomeCapaUnico);

                // 2. Definir o Link de Destino (PDF enviado ou Link Externo/Kiwify)
                let linkDestinoFinal = linkExterno;

                if (pdfFile) {
                    const nomePdfUnico = `pdfs/${Date.now()}_${pdfFile.name.replace(/\s+/g, '_')}`;
                    const { data: uploadPdfData, error: uploadPdfError } = await supabaseClient.storage
                        .from('biblioteca')
                        .upload(nomePdfUnico, pdfFile);

                    if (uploadPdfError) throw new Error("Erro ao enviar PDF: " + uploadPdfError.message);

                    const { data: { publicUrl: pdfUrl } } = supabaseClient.storage
                        .from('biblioteca')
                        .getPublicUrl(nomePdfUnico);

                    linkDestinoFinal = pdfUrl;
                }

                if (!linkDestinoFinal) {
                    throw new Error("Você deve fornecer um arquivo PDF (para livros gratuitos) ou um link externo/Kiwify.");
                }

                // 3. Salvar o Livro na tabela 'livros'
                const { data: livroInserido, error: livroError } = await supabaseClient
                    .from('livros')
                    .insert([{
                        titulo,
                        preco,
                        descricao,
                        capa_url: capaUrl,
                        link_destino: linkDestinoFinal
                    }])
                    .select()
                    .single();

                if (livroError) throw new Error("Erro ao salvar livro no banco: " + livroError.message);

                const livroId = livroInserido.id;

                // 4. Capturar Disciplinas Marcadas e salvar na tabela de relação
                const disciplinasMarcadas = Array.from(document.querySelectorAll('input[name="disciplina_checkbox"]:checked'))
                    .map(cb => parseInt(cb.value));

                if (disciplinasMarcadas.length > 0) {
                    const relacoes = disciplinasMarcadas.map(idDisc => ({
                        livro_id: livroId,
                        id_disciplina: idDisc
                    }));

                    const { error: relError } = await supabaseClient.from('livro_disciplinas').insert(relacoes);
                    if (relError) throw new Error("Erro ao vincular disciplinas: " + relError.message);
                }

                msg.textContent = "✅ Livro cadastrado com sucesso!";
                msg.className = "mt-3 text-xs text-center font-semibold text-green-600";
                document.getElementById('form-cadastro-livro').reset();
                document.getElementById('livro-preco').value = "0.00";

            } catch (err) {
                msg.textContent = "❌ " + err.message;
                msg.className = "mt-3 text-xs text-center font-semibold text-red-600";
            } finally {
                btn.disabled = false;
                btn.textContent = "Salvar e Publicar Livro";
            }
        });

        initAdmin();
    </script>
</body>
</html>
