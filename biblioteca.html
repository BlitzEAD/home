    <main class="w-full max-w-7xl mx-auto px-6 py-8 flex-1">

            <p class="text-gray-600 text-sm mb-6">Encontre livros e materiais complementares para seus estudos.</p>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                
                <!-- Pesquisa por Título -->
                <div class="w-full md:w-1/3 relative">
                    <input type="text" id="input-busca" placeholder="Pesquisar por título..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">

        <div id="grid-livros" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

    <!-- MODAL LIVRO -->

            <button onclick="fecharModalLivroPorBotao()" class="absolute top-4 right-4 text-gray-400 font-bold text-lg">✕</button>
            <div class="overflow-y-auto pr-1 space-y-4">
                <div class="w-full h-64 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center border"><img id="modal-capa" src="" alt="Capa do material" class="h-full object-contain"></div>
                <div><h3 id="modal-titulo" class="text-xl font-extrabold text-gray-900 mb-1"></h3><div id="modal-preco" class="text-lg font-bold text-blue-600"></div></div>

    <!-- MODAL AVISO LOGIN -->
    <div id="modal-aviso-login" class="hidden fixed inset-0 bg-black/50 z-[250] flex items-center justify-center p-4">

                <button onclick="window.location.href='index.html?abrir_login=1'" class="w-1/2 py-2.5 bg-blue-600 text-white font-semibold rounded-lg text-xs">Fazer Login</button>
            </div>
        </div>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let listaLivrosGlobal = []; 
        let usuarioAtual = null;
        let disciplinasCursadasIds = [];
        let semestreEmCursoAtual = "";
        
        let listaCursosGlobal = [];
        let disciplinasGlobalMap = {};
        let gradeDisciplinasPorCurso = {};
        
        let nomeCursoPadraoUsuario = "Administração"; 
        let cursoUsuarioIdOriginal = null;

        async function initBiblioteca() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) usuarioAtual = session.user;
            
            renderizarTopoUsuario(); 
            await carregarEstruturaBanco();
            await carregarDadosUsuario(); 
            
            renderizarSelectCursos();
            renderizarSelectDisciplinas(); 
            await carregarLivros();

            document.getElementById('input-busca').addEventListener('input', filtrarEnderizarLivros);
            
            document.getElementById('select-filtro-curso').addEventListener('change', () => {
                renderizarSelectDisciplinas();
                filtrarEnderizarLivros();
            });

            document.getElementById('select-filtro-disciplina').addEventListener('change', filtrarEnderizarLivros);

            window.addEventListener('popstate', (event) => {
                const path = window.location.pathname;
                if (path.includes('livro_')) {
                    const match = path.match(/livro_(\d+)\.html/);
                    if (match && match[1]) {
                        const livroEncontrado = listaLivrosGlobal.find(l => String(l.id) === String(match[1]));
                        if (livroEncontrado) {
                            const gratuito = livroEncontrado.preco === 0 || livroEncontrado.preco === "0.00";
                            if (!gratuito || usuarioAtual) {
                                abrirModalLivro(livroEncontrado, false); 
                            } else {
                                document.getElementById('modal-aviso-login').classList.remove('hidden');
                            }
                        }
                    }
                } else {
                    document.getElementById('modal-livro').classList.add('hidden');
                }
            });

            verificarLivroUrl();
        }

        async function carregarEstruturaBanco() {
            const { data: cursos } = await supabaseClient.from('cursos').select('*').order('nome');
            listaCursosGlobal = cursos || [];

            const { data: disciplinas } = await supabaseClient.from('disciplinas').select('id, codigo, nome').order('nome');
            if (disciplinas) {
                disciplinas.forEach(d => disciplinasGlobalMap[d.id] = d);
            }

            const { data: relacoes } = await supabaseClient.from('curso_disciplinas').select('*');
            if (relacoes) {
                relacoes.forEach(r => {
                    if (!gradeDisciplinasPorCurso[r.curso_id]) gradeDisciplinasPorCurso[r.curso_id] = [];
                    gradeDisciplinasPorCurso[r.curso_id].push(r.disciplina_id);
                });
            }
        }

        async function carregarDadosUsuario() {
            try {
                if (usuarioAtual) {
                    semestreEmCursoAtual = usuarioAtual.user_metadata?.semestre_em_curso || "";
                    nomeCursoPadraoUsuario = usuarioAtual.user_metadata?.curso || localStorage.getItem('curso_selecionado') || "Administração";

                    if (semestreEmCursoAtual) {
                        const { data } = await supabaseClient.from('planejamento_usuarios').select('disciplina_id, semestre').eq('user_id', usuarioAtual.id);
                        const plan = data || [];
                        disciplinasCursadasIds = plan.filter(p => p.semestre === semestreEmCursoAtual).map(p => p.disciplina_id);
                    }
                } else {
                    semestreEmCursoAtual = localStorage.getItem('semestre_em_curso_visitante') || "";
                    nomeCursoPadraoUsuario = localStorage.getItem('curso_selecionado') || "Administração";

                    if (semestreEmCursoAtual) {
                        const plan = JSON.parse(localStorage.getItem('planejamento_visitante') || '[]');
                        disciplinasCursadasIds = plan.filter(p => p.semestre === semestreEmCursoAtual).map(p => p.disciplina_id);
                    }
                }

                const cursoEncontrado = listaCursosGlobal.find(c => c.nome === nomeCursoPadraoUsuario);
                if (cursoEncontrado) {
                    cursoUsuarioIdOriginal = cursoEncontrado.id;
                }

            } catch (err) {
                console.error("Erro ao carregar dados do usuário:", err);
            }
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            const containerBtnAdmin = document.getElementById('container-btn-admin');
            const isAdmin = usuarioAtual && usuarioAtual.user_metadata?.is_admin === true;
            if (isAdmin && containerBtnAdmin) containerBtnAdmin.innerHTML = `<a href="admin.html" class="bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">⚙️ Admin</a>`;

            if (!usuarioAtual) {
                bloco.innerHTML = `<button onclick="window.location.href='index.html?abrir_login=1'" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Entrar / Cadastrar</button>`;
                return;
            }
            const nome = usuarioAtual.user_metadata?.nome || usuarioAtual.email || "U";
            bloco.innerHTML = `
                <span class="hidden sm:inline text-xs font-medium text-gray-700">${nome.split(' ')[0]}</span>
                <div class="relative">
                    <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs overflow-hidden">${usuarioAtual.user_metadata?.foto_url ? `<img src="${usuarioAtual.user_metadata.foto_url}" class="w-full h-full object-cover">` : nome.charAt(0).toUpperCase()}</button>
                    <div id="dropdown-perfil" class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50 text-sm">
                        <a href="perfil.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Perfil</a>
                        <a href="#" id="btn-sair" class="block px-4 py-2 text-red-600 hover:bg-red-50">Sair</a>
                    </div>
                </div>
            `;
            document.getElementById('btn-avatar-menu').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('dropdown-perfil').classList.toggle('hidden'); });
            window.addEventListener('click', () => { const d = document.getElementById('dropdown-perfil'); if (d && !d.classList.contains('hidden')) d.classList.add('hidden'); });
            document.getElementById('btn-sair').addEventListener('click', async (e) => { e.preventDefault(); await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        }

        function renderizarSelectCursos() {
            const selectCurso = document.getElementById('select-filtro-curso');
            let html = '';
            
            listaCursosGlobal.forEach(c => {
                const isSelected = c.nome === nomeCursoPadraoUsuario ? 'selected' : '';
                html += `<option value="${c.id}" ${isSelected}>${c.nome}</option>`;
            });
            
            selectCurso.innerHTML = html;
        }

        function renderizarSelectDisciplinas() {
            const selectDisc = document.getElementById('select-filtro-disciplina');
            const cursoSelecionadoId = parseInt(document.getElementById('select-filtro-curso').value);
            const cursoObj = listaCursosGlobal.find(c => c.id === cursoSelecionadoId);
            const nomeCurso = cursoObj ? cursoObj.nome : '';
            
            let html = '<option value="">Todos os Livros</option>';
            
            if (semestreEmCursoAtual && cursoSelecionadoId === cursoUsuarioIdOriginal) {
                html += '<option value="CURSANDO">📚 Disciplinas que estou cursando</option>';
            }
            
            html += '<option value="GERAL_PLATAFORMA">Livros sem Curso Definido (Plataforma Geral)</option>';
            
            if (cursoSelecionadoId) {
                html += `<option value="GERAL_CURSO">Livros de ${nomeCurso} (sem disciplina específica)</option>`;
            }
            
            const idsPermitidos = gradeDisciplinasPorCurso[cursoSelecionadoId] || [];
            
            idsPermitidos.forEach(id => {
                const d = disciplinasGlobalMap[id];
                if (d) {
                    html += `<option value="${d.id}">${d.codigo ? d.codigo + ' - ' : ''}${d.nome}</option>`;
                }
            });
            
            selectDisc.innerHTML = html;
        }

        async function carregarLivros() {
            const { data } = await supabaseClient.from('livros').select(`*, livro_disciplinas ( id_disciplina )`).order('criado_em', { ascending: false });
            listaLivrosGlobal = data || []; 
            filtrarEnderizarLivros();
        }

        // Função MÁGICA: Varre a grade da plataforma encontrando IDs de disciplinas diferentes, mas que compartilham o mesmo código EAD
        function getIdsComMesmoCodigo(idsOriginais) {
            if (!idsOriginais || idsOriginais.length === 0) return [];
            let codigos = [];
            
            idsOriginais.forEach(id => {
                const d = disciplinasGlobalMap[id];
                if (d && d.codigo) codigos.push(d.codigo);
            });
            
            let idsExpandidos = [...idsOriginais];
            if (codigos.length > 0) {
                Object.values(disciplinasGlobalMap).forEach(d => {
                    if (d.codigo && codigos.includes(d.codigo) && !idsExpandidos.includes(d.id)) {
                        idsExpandidos.push(d.id);
                    }
                });
            }
            return idsExpandidos;
        }

        function ordenarLivrosIntercalados(livrosParaOrdernar) {
            let cursando = [];
            let doCurso = [];
            let geralPlataforma = [];

            const filtroCursoId = parseInt(document.getElementById('select-filtro-curso').value);
            const idsCursandoExpandidos = getIdsComMesmoCodigo(disciplinasCursadasIds);

            livrosParaOrdernar.forEach(l => {
                const isGeralPlataforma = !l.curso_id && (!l.livro_disciplinas || l.livro_disciplinas.length === 0);
                
                const isCursando = !isGeralPlataforma && 
                                   (filtroCursoId === cursoUsuarioIdOriginal) && 
                                   (l.livro_disciplinas || []).some(r => idsCursandoExpandidos.includes(r.id_disciplina));

                if (isCursando) {
                    cursando.push(l);
                } else if (isGeralPlataforma) {
                    geralPlataforma.push(l);
                } else {
                    doCurso.push(l);
                }
            });

            let resultado = [];
            
            // Proporção de exibição: 3 cursando, 2 do curso, 1 da plataforma
            while (cursando.length > 0 || doCurso.length > 0 || geralPlataforma.length > 0) {
                for (let i = 0; i < 3 && cursando.length > 0; i++) resultado.push(cursando.shift());
                for (let i = 0; i < 2 && doCurso.length > 0; i++) resultado.push(doCurso.shift());
                for (let i = 0; i < 1 && geralPlataforma.length > 0; i++) resultado.push(geralPlataforma.shift());
            }
            
            return resultado;
        }

        function filtrarEnderizarLivros() {
            const texto = document.getElementById('input-busca').value.toLowerCase().trim();
            const filtroCursoId = parseInt(document.getElementById('select-filtro-curso').value);
            const filtroDisc = document.getElementById('select-filtro-disciplina').value;
            
            let baseFiltrados = listaLivrosGlobal;

            // 1. Filtragem Base: O que pertence a este curso na visão expandida?
            if (filtroCursoId) {
                const idsGradeCurso = gradeDisciplinasPorCurso[filtroCursoId] || [];
                const idsExpandidosDoCurso = getIdsComMesmoCodigo(idsGradeCurso);

                baseFiltrados = baseFiltrados.filter(l => {
                    const isGeralPlataforma = !l.curso_id && (!l.livro_disciplinas || l.livro_disciplinas.length === 0);
                    const isGeralDoCursoSelecionado = l.curso_id === filtroCursoId && (!l.livro_disciplinas || l.livro_disciplinas.length === 0);
                    // Match inteligente: O livro tem alguma disciplina associada a um código de disciplina desse curso?
                    const temDisciplinaDoCurso = (l.livro_disciplinas || []).some(r => idsExpandidosDoCurso.includes(r.id_disciplina));

                    return isGeralPlataforma || isGeralDoCursoSelecionado || temDisciplinaDoCurso;
                });
            }

            // 2. Busca por texto
            if (texto !== "") {
                baseFiltrados = baseFiltrados.filter(l => 
                    l.titulo.toLowerCase().includes(texto) || (l.descricao && l.descricao.toLowerCase().includes(texto))
                );
            }

            // 3. Filtro Específico do Dropdown de Disciplinas
            if (filtroDisc === "") {
                const intercalados = ordenarLivrosIntercalados(baseFiltrados);
                renderizarGrid(intercalados);
            } else {
                let matchesFiltro = [];
                let outros = [];

                baseFiltrados.forEach(l => {
                    let matchDisc = false;
                    
                    if (filtroDisc === "GERAL_PLATAFORMA") {
                        matchDisc = !l.curso_id && (!l.livro_disciplinas || l.livro_disciplinas.length === 0);
                    } else if (filtroDisc === "GERAL_CURSO") {
                        matchDisc = l.curso_id === filtroCursoId && (!l.livro_disciplinas || l.livro_disciplinas.length === 0);
                    } else if (filtroDisc === "CURSANDO") {
                        const idsCursandoExpandidos = getIdsComMesmoCodigo(disciplinasCursadasIds);
                        matchDisc = (l.livro_disciplinas || []).some(r => idsCursandoExpandidos.includes(r.id_disciplina));
                    } else {
                        // Expande o ID selecionado no menu para cobrir outras versões do mesmo código
                        const idSelecionado = parseInt(filtroDisc);
                        const idsEspecificoExpandidos = getIdsComMesmoCodigo([idSelecionado]);
                        matchDisc = (l.livro_disciplinas || []).some(r => idsEspecificoExpandidos.includes(r.id_disciplina));
                    }

                    if (matchDisc) matchesFiltro.push(l);
                    else outros.push(l);
                });

                renderizarGrid(matchesFiltro, ordenarLivrosIntercalados(outros));
            }
        }

        function renderizarGrid(principais, secundarios = null) {
            const grid = document.getElementById('grid-livros');
            const idsCursandoExpandidosGlobais = getIdsComMesmoCodigo(disciplinasCursadasIds); // Calculado uma vez para a badge
            
            if (principais.length === 0 && (!secundarios || secundarios.length === 0)) { 
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">Nenhum material encontrado.</div>`; 
                return; 
            }

            let html = '';
            if (principais.length === 0 && secundarios && secundarios.length > 0) {
                html += `<div class="col-span-full text-center py-8 text-gray-500 font-medium">Nenhum material exato para este filtro. Veja outras opções abaixo:</div>`;
            } else {
                principais.forEach(l => html += gerarHtmlCardLivro(l, idsCursandoExpandidosGlobais));
            }

            if (secundarios && secundarios.length > 0) {
                html += `
                    <div class="col-span-full flex items-center justify-center mt-8 mb-4">
                        <div class="h-px bg-gray-200 flex-1"></div>
                        <span class="px-4 bg-gray-50 text-[11px] font-bold text-gray-400 uppercase tracking-widest">Outros títulos que podem te interessar</span>
                        <div class="h-px bg-gray-200 flex-1"></div>
                    </div>
                `;
                secundarios.forEach(l => html += gerarHtmlCardLivro(l, idsCursandoExpandidosGlobais));
            }
            
            grid.innerHTML = html;
        }

        function gerarHtmlCardLivro(l, idsCursando) {
            const precoF = l.preco === 0 || l.preco === "0.00" ? '<span class="text-emerald-600 font-bold">Gratuito</span>' : `R$ ${parseFloat(l.preco).toFixed(2).replace('.', ',')}`;
            
            const filtroCursoId = parseInt(document.getElementById('select-filtro-curso').value);
            const isCursando = (filtroCursoId === cursoUsuarioIdOriginal) && (l.livro_disciplinas || []).some(r => idsCursando.includes(r.id_disciplina));
            const badgeHtml = isCursando ? `<span class="absolute top-3 right-3 bg-amber-400 text-amber-900 text-[9px] font-extrabold px-2 py-0.5 rounded shadow-sm uppercase tracking-wide z-10">Cursando</span>` : '';

            const livroStr = JSON.stringify(l).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
            const tituloSeguro = l.titulo ? l.titulo.replace(/"/g, '&quot;') : 'Capa do material';

            return `
                <div onclick="clicarLivro(${livroStr})" class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group relative">
                    ${badgeHtml}
                    <div>
                        <div class="w-full h-48 bg-gray-100 rounded-lg overflow-hidden mb-3 flex items-center justify-center border relative">
                            <img src="${l.capa_url}" alt="Capa do livro: ${tituloSeguro}" class="h-full object-contain group-hover:scale-105 transition duration-300">
                        </div>
                        <h3 class="font-bold text-gray-800 text-sm line-clamp-2 mb-1">${l.titulo}</h3>
                    </div>
                    <div class="pt-3 border-t flex items-center justify-between mt-2">
                        <span class="text-xs text-gray-500">Detalhes</span>
                        <span class="text-sm font-extrabold">${precoF}</span>
                    </div>
                </div>
            `;
        }

        function clicarLivro(l) { 
            const gratuito = l.preco === 0 || l.preco === "0.00";
            if (gratuito && !usuarioAtual) { 
                document.getElementById('modal-aviso-login').classList.remove('hidden'); 
                return; 
            } 
            abrirModalLivro(l, true); 
        }

        function abrirModalLivro(l, pushState = false) {
            document.getElementById('modal-capa').src = l.capa_url;
            document.getElementById('modal-capa').alt = "Capa expandida do livro: " + (l.titulo ? l.titulo : ''); 
            document.getElementById('modal-titulo').textContent = l.titulo;
            document.getElementById('modal-descricao').textContent = l.descricao || "Sem descrição.";
            const gratuito = l.preco === 0 || l.preco === "0.00";
            document.getElementById('modal-preco').textContent = gratuito ? "Gratuito" : `R$ ${parseFloat(l.preco).toFixed(2).replace('.', ',')}`;
            const btn = document.getElementById('modal-btn-acao');
            btn.textContent = gratuito ? "📥 Download (PDF)" : "🛒 Comprar"; 
            btn.href = l.link_destino;
            
            document.getElementById('modal-livro').classList.remove('hidden');

            if (pushState) {
                const novaUrl = `livro_${l.id}.html`;
                window.history.pushState({ livroId: l.id }, l.titulo, novaUrl);
            }
        }

        function fecharModalLivroPorBotao() {
            document.getElementById('modal-livro').classList.add('hidden');
            window.history.pushState({}, '', 'biblioteca.html');
        }

        function fecharClicandoFora(event) {
            const modalFundo = document.getElementById('modal-livro');
            if (event.target === modalFundo) {
                modalFundo.classList.add('hidden');
                window.history.pushState({}, '', 'biblioteca.html');
            }
        }

        function verificarLivroUrl() {
            const path = window.location.pathname;
            const urlParams = new URLSearchParams(window.location.search);
            const livroIdUrl = urlParams.get('livro_id') || path.match(/livro_(\d+)\.html/)?.[1];

            if (livroIdUrl && listaLivrosGlobal.length > 0) {
                const livroEncontrado = listaLivrosGlobal.find(l => String(l.id) === String(livroIdUrl));
                if (livroEncontrado) {
                    const gratuito = livroEncontrado.preco === 0 || livroEncontrado.preco === "0.00";
                    if (!gratuito || usuarioAtual) {
                        abrirModalLivro(livroEncontrado, false);
                    } else {
                        document.getElementById('modal-aviso-login').classList.add('hidden');
                    }
                }
            }
        }

        initBiblioteca();
    </script>
</body>
</html>
