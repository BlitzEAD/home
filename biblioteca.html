<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Planejamento Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pt-32">

    <!-- MENU SUPERIOR FIXO -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="w-full px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-4">
                <h1 class="text-xs md:text-sm font-extrabold text-blue-600 tracking-tight cursor-pointer" onclick="window.location.href='index.html'">Planejamento Acadêmico</h1>
                <div id="container-btn-admin"></div>
            </div>
            <div class="flex items-center space-x-2 md:space-x-3">
                <div id="bloco-usuario-topo" class="flex items-center space-x-2 pl-2 relative"></div>
            </div>
        </div>
        <div class="w-full bg-gray-50 px-4 md:px-6 py-2">
            <nav class="flex items-center space-x-6 text-xs md:text-sm font-medium text-gray-600 overflow-x-auto">
                <a href="index.html" class="hover:text-blue-600 transition whitespace-nowrap">Disciplinas</a>
                <a href="index.html#secao-grade-disciplinar" class="hover:text-blue-600 transition whitespace-nowrap">Semestres</a>
                <a href="jornal.html" class="hover:text-blue-600 transition whitespace-nowrap">Jornal Blitz</a>
                <a href="biblioteca.html" class="text-blue-600 font-semibold hover:text-blue-700 transition whitespace-nowrap">Biblioteca</a>
                <a href="#" onclick="alert('Funcionalidade em desenvolvimento'); return false;" class="hover:text-blue-600 transition whitespace-nowrap">LOJA</a>
            </nav>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto px-6 py-8 flex-1">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Biblioteca Digital</h2>
            <p class="text-gray-600 text-sm mb-6">Encontre livros e materiais complementares para seus estudos.</p>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="w-full md:w-1/2 relative">
                    <input type="text" id="input-busca" placeholder="Pesquisar por título..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                </div>
                <div class="w-full md:w-1/3">
                    <select id="select-filtro-disciplina" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="">Todas as Disciplinas</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="grid-livros" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">Carregando acervo...</div>
        </div>
    </main>

    <!-- MODAL LIVRO -->
    <div id="modal-livro" class="hidden fixed inset-0 bg-black/50 z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative max-h-[90vh] flex flex-col">
            <button onclick="fecharModalLivro()" class="absolute top-4 right-4 text-gray-400 font-bold text-lg">✕</button>
            <div class="overflow-y-auto pr-1 space-y-4">
                <div class="w-full h-64 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center border"><img id="modal-capa" src="" class="h-full object-contain"></div>
                <div><h3 id="modal-titulo" class="text-xl font-extrabold text-gray-900 mb-1"></h3><div id="modal-preco" class="text-lg font-bold text-blue-600"></div></div>
                <div><h4 class="text-xs font-bold text-gray-500 uppercase mb-1">Sinopse</h4><p id="modal-descricao" class="text-sm text-gray-600 whitespace-pre-line leading-relaxed"></p></div>
            </div>
            <div class="mt-6 pt-4 border-t flex justify-end"><a id="modal-btn-acao" href="#" target="_blank" class="w-full text-center py-3 px-4 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition text-sm"></a></div>
        </div>
    </div>

    <!-- MODAL AVISO LOGIN -->
    <div id="modal-aviso-login" class="hidden fixed inset-0 bg-black/50 z-[250] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center">
            <h3 class="text-lg font-bold text-gray-900 mb-2">🔒 Acesso Restrito</h3>
            <p class="text-xs text-gray-600 mb-6">Para visualizar e baixar os materiais, você precisa estar logado.</p>
            <div class="flex space-x-3">
                <button onclick="document.getElementById('modal-aviso-login').classList.add('hidden')" class="w-1/2 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-lg text-xs">Cancelar</button>
                <button onclick="window.location.href='index.html?abrir_login=1'" class="w-1/2 py-2.5 bg-blue-600 text-white font-semibold rounded-lg text-xs">Fazer Login</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let listaLivrosGlobal = []; let usuarioAtual = null;

        async function initBiblioteca() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) usuarioAtual = session.user;
            renderizarTopoUsuario(); await carregarDisciplinasSelect(); await carregarLivros();
            document.getElementById('input-busca').addEventListener('input', filtrarEnderizarLivros);
            document.getElementById('select-filtro-disciplina').addEventListener('change', filtrarEnderizarLivros);
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            const containerBtnAdmin = document.getElementById('container-btn-admin');
            const isAdmin = usuarioAtual && usuarioAtual.user_metadata?.is_admin === true;
            if (isAdmin && containerBtnAdmin) containerBtnAdmin.innerHTML = `<a href="admin.html" class="bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">⚙️ Admin</a>`;

            if (!usuarioAtual) {
                bloco.innerHTML = `<button onclick="window.location.href='index.html?abrir_login=1'" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Entrar / Cadastrar</button>`;
                return;
            }
            const nome = usuarioAtual.user_metadata?.nome || usuarioAtual.email || "U";
            bloco.innerHTML = `
                <span class="hidden sm:inline text-xs font-medium text-gray-700">${nome.split(' ')[0]}</span>
                <div class="relative">
                    <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs overflow-hidden">${usuarioAtual.user_metadata?.foto_url ? `<img src="${usuarioAtual.user_metadata.foto_url}" class="w-full h-full object-cover">` : nome.charAt(0).toUpperCase()}</button>
                    <div id="dropdown-perfil" class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50 text-sm">
                        <a href="perfil.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Perfil</a>
                        <a href="#" id="btn-sair" class="block px-4 py-2 text-red-600 hover:bg-red-50">Sair</a>
                    </div>
                </div>
            `;
            document.getElementById('btn-avatar-menu').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('dropdown-perfil').classList.toggle('hidden'); });
            window.addEventListener('click', () => { const d = document.getElementById('dropdown-perfil'); if (d && !d.classList.contains('hidden')) d.classList.add('hidden'); });
            document.getElementById('btn-sair').addEventListener('click', async (e) => { e.preventDefault(); await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        }

        async function carregarDisciplinasSelect() {
            const { data } = await supabaseClient.from('disciplinas').select('id, codigo, nome').order('nome');
            if (!data) return;
            let html = '<option value="">Todas as Disciplinas</option><option value="GERAL">Geral</option>';
            data.forEach(d => html += `<option value="${d.id}">${d.codigo ? d.codigo + ' - ' : ''}${d.nome}</option>`);
            document.getElementById('select-filtro-disciplina').innerHTML = html;
        }

        async function carregarLivros() {
            const { data } = await supabaseClient.from('livros').select(`*, livro_disciplinas ( id_disciplina )`).order('criado_em', { ascending: false });
            listaLivrosGlobal = data || []; filtrarEnderizarLivros();
        }

        function filtrarEnderizarLivros() {
            const texto = document.getElementById('input-busca').value.toLowerCase().trim();
            const filtroDisc = document.getElementById('select-filtro-disciplina').value;
            const filtrados = listaLivrosGlobal.filter(l => {
                const matchTexto = l.titulo.toLowerCase().includes(texto) || (l.descricao && l.descricao.toLowerCase().includes(texto));
                let matchDisc = true;
                if (filtroDisc !== "") {
                    if (filtroDisc === "GERAL") matchDisc = (!l.livro_disciplinas || l.livro_disciplinas.length === 0);
                    else matchDisc = (l.livro_disciplinas || []).some(r => r.id_disciplina === parseInt(filtroDisc));
                }
                return matchTexto && matchDisc;
            });
            renderizarGrid(filtrados);
        }

        function renderizarGrid(livros) {
            const grid = document.getElementById('grid-livros');
            if (livros.length === 0) { grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">Nenhum material encontrado.</div>`; return; }
            let html = '';
            livros.forEach(l => {
                const precoF = l.preco === 0 || l.preco === "0.00" ? '<span class="text-emerald-600 font-bold">Gratuito</span>' : `R$ ${parseFloat(l.preco).toFixed(2).replace('.', ',')}`;
                html += `
                    <div onclick='clicarLivro(${JSON.stringify(l)})' class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="w-full h-48 bg-gray-100 rounded-lg overflow-hidden mb-3 flex items-center justify-center border"><img src="${l.capa_url}" class="h-full object-contain group-hover:scale-105 transition duration-300"></div>
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2 mb-1">${l.titulo}</h3>
                        </div>
                        <div class="pt-3 border-t flex items-center justify-between mt-2"><span class="text-xs text-gray-500">Detalhes</span><span class="text-sm font-extrabold">${precoF}</span></div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function clicarLivro(l) { if (!usuarioAtual) { document.getElementById('modal-aviso-login').classList.remove('hidden'); return; } abrirModalLivro(l); }
        function abrirModalLivro(l) {
            document.getElementById('modal-capa').src = l.capa_url; document.getElementById('modal-titulo').textContent = l.titulo;
            document.getElementById('modal-descricao').textContent = l.descricao || "Sem descrição.";
            const gratuito = l.preco === 0 || l.preco === "0.00";
            document.getElementById('modal-preco').textContent = gratuito ? "Gratuito" : `R$ ${parseFloat(l.preco).toFixed(2).replace('.', ',')}`;
            const btn = document.getElementById('modal-btn-acao');
            btn.textContent = gratuito ? "📥 Download (PDF)" : "🛒 Comprar"; btn.href = l.link_destino;
            document.getElementById('modal-livro').classList.remove('hidden');
        }
        function fecharModalLivro() { document.getElementById('modal-livro').classList.add('hidden'); }
        initBiblioteca();
    </script>
</body>
</html>
