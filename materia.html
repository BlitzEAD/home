<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-titulo">Jornal Blitz - Planejamento Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pt-32">

    <!-- MENU SUPERIOR FIXO -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="w-full px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-4">
                <h1 class="text-xs md:text-sm font-extrabold text-blue-600 tracking-tight cursor-pointer" onclick="window.location.href='index.html'">Planejamento Acadêmico</h1>
            </div>
            <div class="flex items-center space-x-2">
                <a href="jornal.html" class="text-xs font-semibold text-gray-600 hover:text-blue-600">Voltar ao Jornal</a>
            </div>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto px-6 py-8 flex-1 space-y-6">
        <div>
            <a href="jornal.html" class="text-xs font-bold text-gray-600 hover:text-blue-600 transition">← Voltar para o Jornal Blitz</a>
        </div>

        <!-- ARTIGO -->
        <article id="artigo-materia" class="bg-white rounded-2xl shadow-md p-6 md:p-10 border border-gray-200">
            <div class="text-center py-16 text-gray-400">Carregando dados da publicação...</div>
        </article>
    </main>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initMateria() {
            const art = document.getElementById('artigo-materia');
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');

            if (!idParam) {
                art.innerHTML = `<div class="text-center py-12 text-red-500 font-semibold">Nenhum ID de matéria foi informado na URL.</div>`;
                return;
            }

            console.log("Buscando matéria com ID:", idParam);

            // Tenta buscar convertendo para número se possível, senão usa string
            let queryId = isNaN(idParam) ? idParam : parseInt(idParam, 10);

            const { data, error } = await supabaseClient
                .from('jornal_posts')
                .select('*')
                .eq('id', queryId);

            if (error) {
                console.error("Erro do Supabase:", error);
                art.innerHTML = `<div class="text-center py-12 text-red-500 font-semibold">Erro ao consultar o banco: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                art.innerHTML = `<div class="text-center py-12 text-red-500 font-semibold">Nenhuma publicação encontrada com o ID: ${idParam}</div>`;
                return;
            }

            const post = data[0];
            document.getElementById('meta-titulo').textContent = `${post.titulo} - Jornal Blitz`;

            const dataF = post.criado_em ? new Date(post.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }) : '';
            const autor = post.autor || 'BlitzEAD';

            art.innerHTML = `
                <div class="mb-6 border-b pb-4">
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase">${post.categoria || 'Notícia'}</span>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mt-2 mb-1 leading-tight">${post.titulo}</h1>
                    <div class="flex items-center space-x-2 text-xs text-gray-400 font-medium"><span>Por <strong class="text-gray-700">${autor}</strong></span><span>•</span><span>${dataF}</span></div>
                </div>

                ${post.capa_url ? `<div class="w-full h-72 md:h-96 bg-gray-100 rounded-xl overflow-hidden mb-8 border"><img src="${post.capa_url}" class="w-full h-full object-cover"></div>` : ''}

                <div class="prose max-w-none text-gray-700 leading-relaxed space-y-4 whitespace-pre-line text-base">${post.conteudo || ''}</div>
            `;
        }

        initMateria();
    </script>
</body>
</html>
