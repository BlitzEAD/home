<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="meta-titulo">Carregando Matéria - Jornal Blitz</title>
    <!-- Meta SEOdinâmica -->
    <meta id="meta-descricao" name="description" content="Acompanhe as notícias e avisos acadêmicos no Jornal Blitz.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pt-32">

    <!-- MENU SUPERIOR FIXO -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="w-full px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-4">
                <h1 class="text-xs md:text-sm font-extrabold text-blue-600 tracking-tight cursor-pointer" onclick="window.location.href='index.html'">Planejamento Acadêmico</h1>
                <div id="container-btn-admin"></div>
            </div>
            <div class="flex items-center space-x-2 md:space-x-3">
                <div id="bloco-usuario-topo" class="flex items-center space-x-2 pl-2 relative"></div>
            </div>
        </div>
        <!-- MENU INFERIOR -->
        <div class="w-full bg-gray-50 px-4 md:px-6 py-2">
            <nav class="flex items-center space-x-6 text-xs md:text-sm font-medium text-gray-600 overflow-x-auto">
                <a href="index.html" class="hover:text-blue-600 transition whitespace-nowrap">Disciplinas</a>
                <a href="index.html#secao-grade-disciplinar" class="hover:text-blue-600 transition whitespace-nowrap">Semestres</a>
                <a href="jornal.html" class="text-blue-600 font-semibold hover:text-blue-700 transition whitespace-nowrap">Jornal Blitz</a>
                <a href="biblioteca.html" class="hover:text-blue-600 transition whitespace-nowrap">Biblioteca</a>
                <a href="#" onclick="alert('Funcionalidade em desenvolvimento'); return false;" class="hover:text-blue-600 transition whitespace-nowrap">LOJA</a>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO DA MATÉRIA -->
    <main class="w-full max-w-4xl mx-auto px-6 py-8 flex-1">
        
        <!-- BOTÃO VOLTAR -->
        <div class="mb-6">
            <a href="jornal.html" class="text-xs font-bold text-gray-600 hover:text-blue-600 transition flex items-center space-x-1">
                <span>← Voltar para o Jornal Blitz</span>
            </a>
        </div>

        <article id="artigo-materia" class="bg-white rounded-2xl shadow-md p-6 md:p-10 border border-gray-200">
            <div class="text-center py-16 text-gray-400">Carregando conteúdo da matéria...</div>
        </article>

    </main>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let usuarioAtual = null;

        async function initMateria() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) usuarioAtual = session.user;
            renderizarTopoUsuario();

            // Pega o ID da URL (?id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('artigo-materia').innerHTML = `<div class="text-center py-12 text-red-500 font-semibold">Matéria não encontrada.</div>`;
                return;
            }

            await carregarDetalhesPost(postId);
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            const containerBtnAdmin = document.getElementById('container-btn-admin');
            const isAdmin = usuarioAtual && usuarioAtual.user_metadata?.is_admin === true;

            if (isAdmin && containerBtnAdmin) {
                containerBtnAdmin.innerHTML = `<a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">⚙️ Área Administrativa</a>`;
            }

            if (!usuarioAtual) {
                bloco.innerHTML = `<button onclick="window.location.href='index.html?abrir_login=1'" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-blue-700 transition shadow-sm whitespace-nowrap">Entrar / Cadastrar</button>`;
                return;
            }

            const metadata = usuarioAtual.user_metadata || {};
            const nome = metadata.nome || usuarioAtual.email || "Usuário";
            const primeiraLetra = nome.charAt(0).toUpperCase();
            const fotoUrl = metadata.foto_url;
            const nomeExibicao = nome.split(' ')[0];
            let avatarHtml = fotoUrl ? `<img src="${fotoUrl}" class="w-full h-full object-cover">` : primeiraLetra;

            bloco.innerHTML = `
                <span class="hidden sm:inline text-xs font-medium text-gray-700">${nomeExibicao}</span>
                <div class="relative">
                    <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs shadow-sm overflow-hidden focus:outline-none">${avatarHtml}</button>
                    <div id="dropdown-perfil" class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50 text-sm">
                        <a href="perfil.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 transition">Perfil</a>
                        <a href="#" id="btn-sair" class="block px-4 py-2 text-red-600 hover:bg-red-50 transition">Sair</a>
                    </div>
                </div>
            `;

            document.getElementById('btn-avatar-menu').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('dropdown-perfil').classList.toggle('hidden');
            });
            window.addEventListener('click', () => {
                const drop = document.getElementById('dropdown-perfil');
                if (drop && !drop.classList.contains('hidden')) drop.classList.add('hidden');
            });
            document.getElementById('btn-sair').addEventListener('click', async (e) => {
                e.preventDefault();
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            });
        }

        async function carregarDetalhesPost(id) {
            const { data: post, error } = await supabaseClient
                .from('jornal_posts')
                .select('*')
                .eq('id', id)
                .single();

            const artigoEl = document.getElementById('artigo-materia');

            if (error || !post) {
                artigoEl.innerHTML = `<div class="text-center py-12 text-red-500 font-semibold">Publicação não encontrada ou removida.</div>`;
                return;
            }

            // Atualiza tags de SEO da página dinamicamente
            document.getElementById('meta-titulo').textContent = `${post.titulo} - Jornal Blitz`;
            if (post.resumo) {
                document.getElementById('meta-descricao').setAttribute('content', post.resumo);
            }

            let dataFormatada = new Date(post.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

            let tagsHtml = '';
            if (post.tags && post.tags.length > 0) {
                tagsHtml = `<div class="flex flex-wrap gap-2 mt-6 pt-6 border-t">`;
                post.tags.forEach(tag => {
                    tagsHtml += `<span class="bg-gray-100 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full">#${tag.trim()}</span>`;
                });
                tagsHtml += `</div>`;
            }

            artigoEl.innerHTML = `
                <div class="mb-6">
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${post.categoria}</span>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mt-3 mb-2 leading-tight">${post.titulo}</h1>
                    <p class="text-xs text-gray-400 font-medium">Publicado em ${dataFormatada}</p>
                </div>

                ${post.capa_url ? `
                    <div class="w-full h-72 md:h-96 bg-gray-100 rounded-xl overflow-hidden mb-8 border">
                        <img src="${post.capa_url}" class="w-full h-full object-cover">
                    </div>
                ` : ''}

                <div class="prose max-w-none text-gray-700 leading-relaxed space-y-4 whitespace-pre-line text-base">
                    ${post.conteudo}
                </div>

                ${tagsHtml}
            `;
        }

        initMateria();
    </script>
</body>
</html>
