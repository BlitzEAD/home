<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa - Jornal Blitz</title>
    
    <meta name="robots" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://wjrpwjrhnpqqtizkekgq.supabase.co">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pt-24 hidden" id="body-admin">
    <!-- Body começa oculto para evitar o "piscar" da tela para alunos não autorizados -->

    <!-- MENU SUPERIOR FIXO -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="w-full px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="flex items-center">
                    <img src="logo.png" alt="Blitz EAD Planejamento Acadêmico" class="h-8 md:h-10 w-auto object-contain">
                </a>
                <span class="bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">Editor do Jornal</span>
            </div>
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-xs font-semibold text-gray-600 hover:text-blue-600 transition">Voltar ao site</a>
                <div id="bloco-usuario-topo" class="flex items-center space-x-2 pl-2 border-l relative"></div>
            </div>
        </div>
        <div class="w-full bg-gray-100 px-4 md:px-6 py-2 flex space-x-4 overflow-x-auto">
            <button id="tab-btn-jornal" class="text-xs font-bold px-4 py-2 rounded-lg bg-blue-600 text-white transition shadow-sm whitespace-nowrap">📰 Gerenciar Jornal Blitz</button>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto px-6 py-8 flex-1">
        
        <!-- ABA JORNAL -->
        <div id="secao-admin-jornal" class="space-y-8">
            <div class="bg-white rounded-2xl shadow-md p-6 md:p-8 border border-gray-200">
                <h2 id="titulo-form-post" class="text-xl font-bold text-gray-900 mb-1">Criar Nova Publicação (Jornal Blitz)</h2>
                <p class="text-gray-500 text-xs mb-6">Publique notícias ou artigos com SEO e autoria personalizada.</p>

                <form id="form-post" class="space-y-4">
                    <input type="hidden" id="post-id-edicao">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Título da Publicação</label>
                            <input type="text" id="post-titulo" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Categoria</label>
                            <select id="post-categoria" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                                <option value="Aviso">Aviso</option>
                                <option value="Notícia" selected>Notícia</option>
                                <option value="Dica de Estudo">Dica de Estudo</option>
                                <option value="Institucional">Institucional</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Autor (Opcional - Padrão: BlitzEAD)</label>
                            <input type="text" id="post-autor" placeholder="Ex: Nome do Colaborador" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Tags (separadas por vírgula)</label>
                            <input type="text" id="post-tags" placeholder="ex: provas, ap1, prazos" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Capa (Arquivo ou URL)</label>
                            <input type="file" id="post-arquivo-capa" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 cursor-pointer mb-1">
                            <input type="text" id="post-capa-url" placeholder="Ou URL da imagem" class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Resumo / Meta Description (SEO)</label>
                        <textarea id="post-resumo" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Breve resumo..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Conteúdo Completo da Matéria</label>
                        <textarea id="post-conteudo" rows="8" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Texto completo..."></textarea>
                    </div>

                    <div class="flex items-center space-x-3 pt-2">
                        <button type="submit" id="btn-salvar-post" class="bg-blue-600 text-white font-semibold py-2.5 px-6 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm flex items-center justify-center min-w-[140px]">Publicar Notícia</button>
                        <button type="button" id="btn-cancelar-edicao-post" onclick="cancelarEdicaoPost()" class="hidden bg-gray-200 text-gray-700 font-semibold py-2.5 px-4 rounded-lg hover:bg-gray-300 transition text-sm">Cancelar Edição</button>
                    </div>
                </form>
            </div>

            <!-- PAINEL DE BUSCA E FILTROS DE POSTS -->
            <div class="bg-white rounded-2xl shadow-md p-6 md:p-8 border border-gray-200 space-y-4">
                <h3 class="text-lg font-bold text-gray-900">Publicações do Jornal Blitz</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="relative">
                        <input type="text" id="input-busca-admin-posts" placeholder="Buscar título/resumo..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                    </div>
                    <div>
                        <select id="select-filtro-admin-cat" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="">Todas as Categorias</option>
                            <option value="Aviso">Aviso</option>
                            <option value="Notícia">Notícia</option>
                            <option value="Dica de Estudo">Dica de Estudo</option>
                            <option value="Institucional">Institucional</option>
                        </select>
                    </div>
                    <div>
                        <select id="select-filtro-admin-autor" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="">Todos os Autores</option>
                        </select>
                    </div>
                    <div class="flex items-center space-x-1">
                        <input type="date" id="input-data-inicio" title="Data Inicial" class="w-1/2 px-2 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
                        <span class="text-gray-400 text-xs">até</span>
                        <input type="date" id="input-data-fim" title="Data Final" class="w-1/2 px-2 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="overflow-x-auto pt-2">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 text-xs uppercase tracking-wider">
                                <th class="p-3 border-b">Título</th>
                                <th class="p-3 border-b">Autor</th>
                                <th class="p-3 border-b">Categoria</th>
                                <th class="p-3 border-b">Data</th>
                                <th class="p-3 border-b text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-admin-posts">
                            <tr><td colspan="5" class="p-6 text-center text-gray-400">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let usuarioAtual = null;

        let listaPostsAdminGlobal = [];

        function setLoadingState(btnId, isLoading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.disabled = true;
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processando...`;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.dataset.originalText;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        async function initAdmin() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const role = session?.user?.user_metadata?.role || 'aluno';
            
            // Trava de Segurança
            const cargosPermitidos = ['dono', 'super_admin', 'editor_geral', 'editor_jornal'];
            
            if (!session || !cargosPermitidos.includes(role)) {
                alert("Acesso Negado: Você não tem permissão para publicar matérias no Jornal.");
                window.location.href = 'index.html'; 
                return;
            }

            document.getElementById('body-admin').classList.remove('hidden');
            usuarioAtual = session.user;
            renderizarTopoUsuario();

            await carregarAdminPosts();

            document.getElementById('input-busca-admin-posts').addEventListener('input', renderizarTabelaPostsFiltrados);
            document.getElementById('select-filtro-admin-cat').addEventListener('change', renderizarTabelaPostsFiltrados);
            document.getElementById('select-filtro-admin-autor').addEventListener('change', renderizarTabelaPostsFiltrados);
            document.getElementById('input-data-inicio').addEventListener('change', renderizarTabelaPostsFiltrados);
            document.getElementById('input-data-fim').addEventListener('change', renderizarTabelaPostsFiltrados);
        }

        async function registrarLogAuditoria(acao, detalhes) {
            try {
                if (!usuarioAtual) return;
                const nomeAdmin = usuarioAtual.user_metadata?.nome || usuarioAtual.email;
                const roleAdmin = usuarioAtual.user_metadata?.role || 'admin';
                const textoLog = `${roleAdmin} - ${nomeAdmin} (${usuarioAtual.email}) - ${acao} - ${detalhes}`;

                await supabaseClient.from('logs_admin').insert([{
                    autor: textoLog,
                    criado_em: new Date().toISOString()
                }]);
            } catch (err) {
                console.error("Erro ao registrar log:", err);
            }
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            bloco.innerHTML = `<span class="text-xs font-medium text-gray-700">${(usuarioAtual.user_metadata?.nome || usuarioAtual.email).split(' ')[0]} (Admin)</span>`;
        }

        async function redimensionarImagem(file, larguraMax = 600, qualidade = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
                        if (w > larguraMax) { h = Math.round((h * larguraMax) / w); w = larguraMax; }
                        canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob((blob) => resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() })), 'image/jpeg', qualidade);
                    };
                };
            });
        }

        async function dispararBuildAutomatico() { try {} catch (err) {} }

        async function carregarAdminPosts() {
            const { data } = await supabaseClient.from('jornal_posts').select('*').order('criado_em', { ascending: false });
            listaPostsAdminGlobal = data || [];
            
            const autoresUnicos = [...new Set(listaPostsAdminGlobal.map(p => p.autor || 'BlitzEAD'))];
            let autorHtml = '<option value="">Todos os Autores</option>';
            autoresUnicos.forEach(aut => { autorHtml += `<option value="${aut}">${aut}</option>`; });
            document.getElementById('select-filtro-admin-autor').innerHTML = autorHtml;
            
            renderizarTabelaPostsFiltrados();
        }

        function renderizarTabelaPostsFiltrados() {
            const tbody = document.getElementById('tabela-admin-posts');
            const textoBusca = document.getElementById('input-busca-admin-posts').value.toLowerCase().trim();
            const catFiltro = document.getElementById('select-filtro-admin-cat').value;
            const autorFiltro = document.getElementById('select-filtro-admin-autor').value;
            const dataInicio = document.getElementById('input-data-inicio').value;
            const dataFim = document.getElementById('input-data-fim').value;

            let filtrados = listaPostsAdminGlobal;
            if (textoBusca !== "") filtrados = filtrados.filter(p => p.titulo.toLowerCase().includes(textoBusca) || (p.resumo && p.resumo.toLowerCase().includes(textoBusca)));
            if (catFiltro !== "") filtrados = filtrados.filter(p => p.categoria === catFiltro);
            if (autorFiltro !== "") filtrados = filtrados.filter(p => (p.autor || 'BlitzEAD') === autorFiltro);
            if (dataInicio) { const dInicio = new Date(dataInicio + "T00:00:00"); filtrados = filtrados.filter(p => new Date(p.criado_em) >= dInicio); }
            if (dataFim) { const dFim = new Date(dataFim + "T23:59:59"); filtrados = filtrados.filter(p => new Date(p.criado_em) <= dFim); }

            if (filtrados.length === 0) { tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">Nenhuma publicação encontrada.</td></tr>`; return; }

            let html = '';
            filtrados.forEach(p => {
                const dataFormatada = p.criado_em ? new Date(p.criado_em).toLocaleDateString('pt-BR') : '-';
                html += `<tr class="border-b hover:bg-gray-50 text-sm"><td class="p-3 font-medium text-gray-800">${p.titulo}</td><td class="p-3 text-gray-600 text-xs">${p.autor || 'BlitzEAD'}</td><td class="p-3"><span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded">${p.categoria}</span></td><td class="p-3 text-gray-500 text-xs">${dataFormatada}</td><td class="p-3 text-center space-x-2"><button onclick='editarPost(${JSON.stringify(p)})' class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 rounded text-xs font-semibold">Editar</button><button onclick="deletarPost(${p.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded text-xs font-semibold">Excluir</button></td></tr>`;
            });
            tbody.innerHTML = html;
        }

        document.getElementById('form-post').addEventListener('submit', async (e) => {
            e.preventDefault(); setLoadingState('btn-salvar-post', true);
            const idEdicao = document.getElementById('post-id-edicao').value;
            const titulo = document.getElementById('post-titulo').value; 
            const categoria = document.getElementById('post-categoria').value;
            const autor = document.getElementById('post-autor').value.trim() !== "" ? document.getElementById('post-autor').value.trim() : "BlitzEAD";
            const resumo = document.getElementById('post-resumo').value; 
            const conteudo = document.getElementById('post-conteudo').value;
            const tags = document.getElementById('post-tags').value ? document.getElementById('post-tags').value.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];
            let capaUrl = document.getElementById('post-capa-url').value.trim(); 
            const arquivoCapa = document.getElementById('post-arquivo-capa').files[0];
            const slug = titulo.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');

            try {
                if (arquivoCapa) { 
                    const otimizada = await redimensionarImagem(arquivoCapa, 600, 0.8); 
                    const nomeArq = `jornal_${Date.now()}.jpg`; 
                    await supabaseClient.storage.from('biblioteca').upload(nomeArq, otimizada); 
                    const { data: pub } = supabaseClient.storage.from('biblioteca').getPublicUrl(nomeArq); 
                    capaUrl = pub.publicUrl; 
                }

                if (idEdicao) { 
                    await supabaseClient.from('jornal_posts').update({ titulo, slug, categoria, autor, resumo, conteudo, tags, capa_url: capaUrl }).eq('id', idEdicao); 
                    await registrarLogAuditoria('editou a matéria', `Título: ${titulo}`); 
                    alert("Publicação atualizada com sucesso!"); 
                } else { 
                    await supabaseClient.from('jornal_posts').insert([{ titulo, slug, categoria, autor, resumo, conteudo, tags, capa_url: capaUrl }]); 
                    await registrarLogAuditoria('publicou a matéria', `Título: ${titulo}`); 
                    alert("Notícia publicada com sucesso!"); 
                }

                await dispararBuildAutomatico(); 
                cancelarEdicaoPost(); 
                await carregarAdminPosts();
            } catch (err) { 
                alert("Erro: " + err.message); 
            } finally { 
                setLoadingState('btn-salvar-post', false); 
            }
        });

        function editarPost(post) {
            document.getElementById('post-id-edicao').value = post.id; 
            document.getElementById('post-titulo').value = post.titulo;
            document.getElementById('post-categoria').value = post.categoria; 
            document.getElementById('post-autor').value = post.autor === 'BlitzEAD' ? '' : (post.autor || '');
            document.getElementById('post-resumo').value = post.resumo || ''; 
            document.getElementById('post-conteudo').value = post.conteudo || '';
            document.getElementById('post-tags').value = post.tags ? post.tags.join(', ') : ''; 
            document.getElementById('post-capa-url').value = post.capa_url || '';
            
            document.getElementById('titulo-form-post').textContent = "Editar Publicação"; 
            document.getElementById('btn-salvar-post').textContent = "Atualizar Publicação";
            document.getElementById('btn-cancelar-edicao-post').classList.remove('hidden'); 
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicaoPost() {
            document.getElementById('form-post').reset(); 
            document.getElementById('post-id-edicao').value = '';
            document.getElementById('titulo-form-post').textContent = "Criar Nova Publicação (Jornal Blitz)"; 
            document.getElementById('btn-salvar-post').textContent = "Publicar Notícia";
            document.getElementById('btn-cancelar-edicao-post').classList.add('hidden');
        }

        async function deletarPost(id) {
            if (!confirm("Tem certeza que deseja excluir esta publicação?")) return;
            await supabaseClient.from('jornal_posts').delete().eq('id', id); 
            await registrarLogAuditoria('excluiu a matéria ID', `${id}`);
            await dispararBuildAutomatico(); 
            await carregarAdminPosts(); 
        }

        initAdmin();
    </script>
</body>
</html>
