        <!-- DETALHES DO LIVRO -->

                </div>
                <div class="w-full md:w-2/3 flex flex-col justify-between space-y-4">
                    <div>
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Material da Biblioteca</span>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mt-3 mb-2 leading-tight">Entendendo a Terra</h1>
                        <div id="preco-livro-tag" class="text-xl font-bold text-blue-600 mb-4">Gratuito</div>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-gray-500 uppercase mb-1">Sinopse / Descrição</h4>
                        <p class="text-sm text-gray-600 whitespace-pre-line leading-relaxed">Terra sendo entendida</p>
                    </div>
                    <div class="pt-4 border-t">
                        <!-- O link foi removido daqui e será injetado de forma totalmente segura pelo JavaScript -->
                        <a id="btn-acao-livro" href="#" onclick="tratarCliqueBotaoAcao(event)" class="block w-full text-center py-3 px-4 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition text-sm shadow-sm">

    <!-- MODAL AVISO LOGIN -->
    <div id="modal-aviso-login" class="hidden fixed inset-0 bg-black/50 z-[250] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center">
            <h3 class="text-lg font-bold text-gray-900 mb-2">🔒 Acesso Restrito</h3>
            <p class="text-xs text-gray-600 mb-6">Para visualizar e baixar os materiais gratuitos, você precisa estar logado.</p>
            <div class="flex space-x-3">
                <button onclick="document.getElementById('modal-aviso-login').classList.add('hidden')" class="w-1/2 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-lg text-xs">Cancelar</button>
                <button onclick="window.location.href='index.html?abrir_login=1'" class="w-1/2 py-2.5 bg-blue-600 text-white font-semibold rounded-lg text-xs">Fazer Login</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const LIVRO_ID_ATUAL = 13;
        let usuarioAtual = null;

        async function initLivroTemplate() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) usuarioAtual = session.user;
            renderizarTopoUsuario();
            await configurarBotaoSeguro();
        }

        async function configurarBotaoSeguro() {
            const precoTexto = document.getElementById('preco-livro-tag').textContent.trim().toLowerCase();
            const btn = document.getElementById('btn-acao-livro');
            const isGratuito = precoTexto.includes('gratuito') || precoTexto.includes('r$ 0') || precoTexto.includes('0,00');
            
            // Define o texto visual do botão
            if (isGratuito) {
                btn.textContent = "📥 Download (PDF)";
            } else {
                btn.textContent = "🛒 Comprar";
            }

            // SEGURANÇA MÁXIMA: Se for gratuito e o usuário NÃO estiver logado, 
            // o link não é buscado e o botão continua sem URL ("#").
            if (isGratuito && !usuarioAtual) {
                btn.href = "#";
                return;
            }

            // Se for pago ou se o usuário estiver logado em um material gratuito, 
    // buscamos o link de forma segura direto do banco de dados
            try {
                const { data, error } = await supabaseClient
                    .from('livros')
                    .select('link_destino')
                    .eq('id', LIVRO_ID_ATUAL)
                    .single();
                    
                if (data && data.link_destino) {
                    btn.href = data.link_destino;
                    btn.target = "_blank";
                } else {
                    btn.href = "#";
                }
            } catch (err) {
                console.error("Erro ao carregar link protegido:", err);
                btn.href = "#";
            }
        }

        function tratarCliqueBotaoAcao(event) {
            const precoTexto = document.getElementById('preco-livro-tag').textContent.trim().toLowerCase();
            const isGratuito = precoTexto.includes('gratuito') || precoTexto.includes('r$ 0') || precoTexto.includes('0,00');

            // Se for gratuito e o usuário não estiver logado, bloqueia a ação e exibe o modal de login
            if (isGratuito && !usuarioAtual) {
                event.preventDefault();
                document.getElementById('modal-aviso-login').classList.remove('hidden');
            }
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            const containerBtnAdmin = document.getElementById('container-btn-admin');
            
            if (containerBtnAdmin) {
                const isAdmin = usuarioAtual && usuarioAtual.user_metadata?.is_admin === true;
                if (isAdmin) containerBtnAdmin.innerHTML = `<a href="admin.html" class="bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">⚙️ Admin</a>`;
                else containerBtnAdmin.innerHTML = '';
            }

            if (!bloco) return;
            if (!usuarioAtual) {
                bloco.innerHTML = `<button onclick="window.location.href='index.html?abrir_login=1'" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap">Entrar / Cadastrar</button>`;
                return;
            }
            const nome = usuarioAtual.user_metadata?.nome || usuarioAtual.email || "U";
            bloco.innerHTML = `
                <span class="hidden sm:inline text-xs font-medium text-gray-700">${nome.split(' ')[0]}</span>
                <div class="relative">
                    <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs overflow-hidden">${usuarioAtual.user_metadata?.foto_url ? `<img src="${usuarioAtual.user_metadata.foto_url}" class="w-full h-full object-cover">` : nome.charAt(0).toUpperCase()}</button>
                    <div id="dropdown-perfil" class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50 text-sm">
                        <a href="perfil.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Perfil</a>
                        <a href="#" id="btn-sair" class="block px-4 py-2 text-red-600 hover:bg-red-50">Sair</a>
                    </div>
                </div>
            `;
            document.getElementById('btn-avatar-menu').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('dropdown-perfil').classList.toggle('hidden'); });
            window.addEventListener('click', () => { const d = document.getElementById('dropdown-perfil'); if (d && !d.classList.contains('hidden')) d.classList.add('hidden'); });
            document.getElementById('btn-sair').addEventListener('click', async (e) => { e.preventDefault(); await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        }

        initLivroTemplate();
    </script>
</body>
