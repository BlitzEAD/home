<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Planejamento Acadêmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col pt-32">

    <!-- MENU SUPERIOR FIXO -->
    <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="w-full px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-4">
                <h1 class="text-xs md:text-sm font-extrabold text-blue-600 tracking-tight cursor-pointer" onclick="window.location.href='index.html'">Planejamento Acadêmico</h1>
                <div id="container-btn-admin"></div>
            </div>
            <div class="flex items-center space-x-2 md:space-x-3">
                <div id="bloco-usuario-topo" class="flex items-center space-x-2 pl-2 relative"></div>
            </div>
        </div>
        <!-- MENU INFERIOR CORRIGIDO -->
        <div class="w-full bg-gray-50 px-4 md:px-6 py-2">
            <nav class="flex items-center space-x-6 text-xs md:text-sm font-medium text-gray-600 overflow-x-auto">
                <a href="index.html" class="hover:text-blue-600 transition whitespace-nowrap">Disciplinas</a>
                <a href="index.html#secao-grade-disciplinar" class="hover:text-blue-600 transition whitespace-nowrap">Semestres</a>
                <a href="jornal.html" class="hover:text-blue-600 transition whitespace-nowrap">Jornal Blitz</a>
                <a href="biblioteca.html" class="hover:text-blue-600 transition whitespace-nowrap">Biblioteca</a>
                <a href="#" onclick="alert('Funcionalidade em desenvolvimento'); return false;" class="hover:text-blue-600 transition whitespace-nowrap">LOJA</a>
            </nav>
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto px-6 py-8 flex-1">
        <div class="bg-white rounded-2xl shadow-md p-6 md:p-8 border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-900 mb-1">Configurações de Perfil</h2>
            <p class="text-gray-500 text-xs mb-6">Atualize suas informações cadastrais e foto de perfil.</p>

            <form id="form-perfil" class="space-y-4">
                <div class="flex items-center space-x-4 pb-4 border-b">
                    <div id="preview-avatar" class="w-16 h-16 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xl overflow-hidden shadow-sm border-2 border-gray-100"></div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Foto de Perfil (Opcional)</label>
                        <input type="file" id="input-foto-perfil" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="perfil-nome" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">E-mail de Acesso</label>
                    <input type="email" id="perfil-email" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Curso</label>
                    <select id="perfil-curso" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="Administração">Administração</option>
                        <option value="Administração Pública">Administração Pública</option>
                        <option value="Biblioteconomia">Biblioteconomia</option>
                        <option value="Ciências Contábeis">Ciências Contábeis</option>
                        <option value="Engenharia de Produção">Engenharia de Produção</option>
                        <option value="Licenciatura em Ciências Biológicas">Licenciatura em Ciências Biológicas</option>
                        <option value="Licenciatura em Matemática">Licenciatura em Matemática</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Semestre de Ingresso</label>
                    <select id="perfil-semestre" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="">Nenhum</option>
                    </select>
                </div>

                <div class="pt-4 border-t flex items-center justify-between">
                    <a href="index.html" class="text-xs text-gray-600 hover:underline font-semibold">← Voltar ao Planejamento</a>
                    <button type="submit" id="btn-salvar-perfil" class="bg-blue-600 text-white font-semibold py-2.5 px-6 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm">Salvar Alterações</button>
                </div>
            </form>
            <div id="msg-perfil" class="mt-4 text-xs text-center font-medium"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://wjrpwjrhnpqqtizkekgq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcnB3anJobnBxcXRpemtla2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzUxOTQsImV4cCI6MjEwMDU1MTE5NH0.UriDrr4Kk8mTmw36xbSrdzZE9ZtOWaaZ0jDUtGmTlo4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let usuarioAtual = null;

        async function initPerfil() {
            gerarOpcoesSemestres();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { alert("Faça login para acessar o perfil."); window.location.href = 'index.html'; return; }
            usuarioAtual = session.user;
            renderizarTopoUsuario();
            preencherDadosPerfil();
        }

        function gerarOpcoesSemestres() {
            const select = document.getElementById('perfil-semestre'); if (!select) return;
            let html = '<option value="">Nenhum</option>';
            for (let ano = 2026; ano >= 2019; ano--) {
                for (let sem = 2; sem >= 1; sem--) {
                    if (ano === 2026 && sem > 2) continue;
                    html += `<option value="${ano}-${sem}">${ano}-${sem}</option>`;
                }
            }
            select.innerHTML = html;
        }

        function renderizarTopoUsuario() {
            const bloco = document.getElementById('bloco-usuario-topo');
            const containerBtnAdmin = document.getElementById('container-btn-admin');
            const isAdmin = usuarioAtual && usuarioAtual.user_metadata?.is_admin === true;
            if (isAdmin && containerBtnAdmin) containerBtnAdmin.innerHTML = `<a href="admin.html" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">⚙️ Admin</a>`;

            const metadata = usuarioAtual.user_metadata || {};
            const nome = metadata.nome || usuarioAtual.email || "Usuário";
            const primeiraLetra = nome.charAt(0).toUpperCase();
            const fotoUrl = metadata.foto_url;
            let avatarHtml = fotoUrl ? `<img src="${fotoUrl}" class="w-full h-full object-cover">` : primeiraLetra;

            document.getElementById('preview-avatar').innerHTML = avatarHtml;
            bloco.innerHTML = `
                <span class="hidden sm:inline text-xs font-medium text-gray-700">${nome.split(' ')[0]}</span>
                <div class="relative">
                    <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-xs overflow-hidden focus:outline-none">${avatarHtml}</button>
                    <div id="dropdown-perfil" class="hidden absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50 text-sm">
                        <a href="perfil.html" class="block px-4 py-2 text-blue-600 font-semibold bg-blue-50">Perfil</a>
                        <a href="#" id="btn-sair" class="block px-4 py-2 text-red-600 hover:bg-red-50">Sair</a>
                    </div>
                </div>
            `;
            document.getElementById('btn-avatar-menu').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('dropdown-perfil').classList.toggle('hidden'); });
            window.addEventListener('click', () => { const d = document.getElementById('dropdown-perfil'); if (d && !d.classList.contains('hidden')) d.classList.add('hidden'); });
            document.getElementById('btn-sair').addEventListener('click', async (e) => { e.preventDefault(); await supabaseClient.auth.signOut(); window.location.href = 'index.html'; });
        }

        function preencherDadosPerfil() {
            if (!usuarioAtual) return;
            document.getElementById('perfil-email').value = usuarioAtual.email || '';
            const md = usuarioAtual.user_metadata || {};
            document.getElementById('perfil-nome').value = md.nome || '';
            document.getElementById('perfil-curso').value = md.curso || 'Administração';
            document.getElementById('perfil-semestre').value = md.semestre_ingresso || '';
        }

        async function redimensionarImagem(file, larguraMax = 300, qualidade = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
                        if (w > larguraMax) { h = Math.round((h * larguraMax) / w); w = larguraMax; }
                        canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(blob => resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() })), 'image/jpeg', qualidade);
                    };
                };
            });
        }

        document.getElementById('form-perfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-perfil'); const msg = document.getElementById('msg-perfil');
            const nome = document.getElementById('perfil-nome').value; const email = document.getElementById('perfil-email').value.trim();
            const curso = document.getElementById('perfil-curso').value; const semestre = document.getElementById('perfil-semestre').value;
            const fotoFile = document.getElementById('input-foto-perfil').files[0];
            btn.disabled = true; btn.textContent = "Salvando...";

            try {
                let fotoUrl = usuarioAtual.user_metadata?.foto_url || null;
                if (fotoFile) {
                    const otimizada = await redimensionarImagem(fotoFile, 250, 0.75);
                    const nomeArq = `avatar_${usuarioAtual.id}_${Date.now()}.jpg`;
                    await supabaseClient.storage.from('biblioteca').upload(nomeArq, otimizada, { upsert: true });
                    const { data: pub } = supabaseClient.storage.from('biblioteca').getPublicUrl(nomeArq);
                    fotoUrl = pub.publicUrl;
                }

                let alterouEmail = email !== usuarioAtual.email;
                const { data, error } = await supabaseClient.auth.updateUser({ email: alterouEmail ? email : undefined, data: { nome, curso, semestre_ingresso: semestre, foto_url: fotoUrl } });
                if (error) throw error;
                usuarioAtual = data.user; renderizarTopoUsuario(); preencherDadosPerfil();
                msg.textContent = alterouEmail ? "✅ Salvo! Verifique o e-mail de confirmação." : "✅ Perfil atualizado com sucesso!";
                msg.className = "mt-4 text-xs text-center font-medium text-green-600";
            } catch (err) {
                msg.textContent = "❌ " + err.message; msg.className = "mt-4 text-xs text-center font-medium text-red-600";
            } finally { btn.disabled = false; btn.textContent = "Salvar Alterações"; }
        });

        initPerfil();
    </script>
</body>
</html>
